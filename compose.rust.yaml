services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${RUST_FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APPLICATION_DATABASE_URL: postgresql://wicked_application:${APPLICATION_DATABASE_PASSWORD:-wicked-local-development-only}@application-db:5432/wicked_application
      CSRF_COOKIE_KEY: ${CSRF_COOKIE_KEY:-wicked-local-development-only-csrf-cookie-key-replace-before-a-shared-deployment-0000}
      IDENTITY_DATABASE_URL: postgresql://wicked_identity:${IDENTITY_DATABASE_PASSWORD:-wicked-local-development-only}@identity-db:5432/wicked_identity
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@wicked-learning.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Wicked Learning}
      MEDIA_ROOT: /var/lib/wicked-learning/media
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8081}
      SESSION_COOKIE_SECURE: "false"
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Static only for disposable local development. Set a unique 32-byte
      # Base64 key in every shared environment and retain it for the life of
      # any enrolled TOTP factors.
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-d2lja2VkLWxlYXJuaW5nLWxvY2FsLXRvdHAta2V5LTA=}
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:-d2lja2VkLWxlYXJuaW5nLWxvY2FsLWFpLWtleS0wMDE=}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      application-db:
        condition: service_healthy
      identity-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - wicked_media:/var/lib/wicked-learning/media
    restart: unless-stopped

  application-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: wicked_application
      POSTGRES_USER: wicked_application
      POSTGRES_PASSWORD: ${APPLICATION_DATABASE_PASSWORD:-wicked-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wicked_application -d wicked_application"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - wicked_application_database:/var/lib/postgresql/data
    restart: unless-stopped

  identity-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: wicked_identity
      POSTGRES_USER: wicked_identity
      POSTGRES_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:-wicked-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wicked_identity -d wicked_identity"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - wicked_identity_database:/var/lib/postgresql/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.28
    ports:
      - "${RUST_MAILPIT_PORT:-8026}:8025"
    restart: unless-stopped

volumes:
  wicked_application_database:
  wicked_identity_database:
  wicked_media:
