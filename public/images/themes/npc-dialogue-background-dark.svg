  <path d="M0 730 Q350 650 720 740 T1600 700 V900 H0Z" fill="#081522"/>
  <path d="M680 900 C710 770 790 690 860 600 C930 690 1010 770 1040 900Z" fill="#183d56" opacity=".85"/>
  <path d="M0 840 Q320 760 640 830 T1280 810 T1600 840" fill="none" stroke="#1e6177" stroke-width="8" opacity=".6"/>
  <g fill="#2dd4bf" opacity=".6">
