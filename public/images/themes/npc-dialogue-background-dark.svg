<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Night learning garden</title>
  <desc id="desc">A calm dark blue scene with a path, stars and a warm lantern.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071326"/>
      <stop offset="1" stop-color="#10253b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#67e8f9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1230" cy="190" r="190" fill="url(#glow)" opacity=".3"/>
