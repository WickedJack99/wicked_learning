<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Pattern lens</title>
  <desc id="desc">A luminous lens with a small pattern of connected points.</desc>
  <defs>
    <radialGradient id="glass" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#d9fbff" stop-opacity=".95"/>
      <stop offset=".48" stop-color="#49d5e8" stop-opacity=".74"/>
      <stop offset="1" stop-color="#12627b" stop-opacity=".92"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#b9f5f5"/>
      <stop offset=".5" stop-color="#1a9bb0"/>
      <stop offset="1" stop-color="#07546b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="m204 214 54 54" stroke="#07131c" stroke-width="33" stroke-linecap="round"/>
  <path d="m204 214 54 54" stroke="url(#metal)" stroke-width="23" stroke-linecap="round"/>
  <path d="m241 251 25 25" stroke="#b8f4f2" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/>
  <circle cx="145" cy="145" r="105" fill="#06141d" stroke="#061019" stroke-width="12"/>
  <circle cx="145" cy="145" r="96" fill="url(#glass)" stroke="url(#metal)" stroke-width="8" filter="url(#glow)"/>
  <path d="M83 102c24-31 66-43 101-23" fill="none" stroke="#fff" stroke-opacity=".58" stroke-width="9" stroke-linecap="round"/>
  <g fill="none" stroke="#f9d779" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m102 163 28-32 30 17 29-38"/>
    <path d="m130 131 4 43 26-26" stroke="#ff9b72"/>
  </g>
  <g fill="#f9d779" stroke="#083447" stroke-width="4">
    <circle cx="102" cy="163" r="9"/>
    <circle cx="130" cy="131" r="9"/>
    <circle cx="160" cy="148" r="9"/>
    <circle cx="189" cy="110" r="9"/>
    <circle cx="134" cy="174" r="9" fill="#ff9b72"/>
  </g>
</svg>
