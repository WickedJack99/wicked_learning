name: Rust replatform foundation

on:
  push:
    paths:
      - backend/**
      - contracts/**
      - frontend/**
      - compose.rust.yaml
      - .github/workflows/replatform.yml
  pull_request:
    paths:
      - backend/**
      - contracts/**
      - frontend/**
      - compose.rust.yaml
      - .github/workflows/replatform.yml

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Check Rust formatting and tests
        working-directory: backend
        run: |
          cargo +1.88.0 fmt --check
          cargo +1.88.0 test --locked

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check generated client and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check:api
          npm run build

      - name: Validate local Compose definition
        run: docker compose -f compose.rust.yaml config --quiet

      - name: Start the isolated replatform stack
        run: |
          docker compose -f compose.rust.yaml up --detach --wait application-db identity-db
          docker compose -f compose.rust.yaml run --rm backend migrate
          docker compose -f compose.rust.yaml up --detach --build --wait frontend
          curl --fail --show-error http://127.0.0.1:8081/api/v1/health/ready

      - name: Run browser acceptance checks
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Stop the isolated replatform stack
        if: always()
        run: docker compose -f compose.rust.yaml down --volumes --remove-orphans
