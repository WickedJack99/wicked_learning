[package]
name = "wicked-learning-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
async-openai = { version = "0.43", default-features = false, features = ["responses"] }
aes-gcm = "0.10"
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart"] }
axum_csrf = { version = "0.12", features = ["layer"] }
axum-login = "0.18"
base64 = "0.22"
email_address = "0.2"
futures-util = "0.3"
infer = "0.19"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
object_store = { version = "0.14", default-features = false, features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower_governor = "0.8"
tower-http = { version = "0.6", features = ["limit", "request-id", "timeout", "trace"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
totp-rs = { version = "6", default-features = false, features = ["gen_secret", "otpauth", "qr", "std"] }
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"
webauthn-rs = { version = "0.6.2", features = ["conditional-ui", "danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.6.2"
wicked-learning-persistence = { path = "../persistence" }
wicked-learning-application = { path = "../application" }
wicked-learning-domain = { path = "../domain" }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
