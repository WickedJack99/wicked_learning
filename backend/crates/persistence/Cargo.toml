[package]
name = "wicked-learning-persistence"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-stream = "0.3"
futures-util = "0.3"
serde.workspace = true
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["json", "macros", "postgres", "runtime-tokio-rustls", "time", "uuid"] }
time = { version = "0.3", features = ["parsing"] }
tracing = "0.1"
uuid.workspace = true
wicked-learning-application = { path = "../application" }
wicked-learning-domain = { path = "../domain" }
