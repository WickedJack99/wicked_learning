[package]
name = "wicked-learning-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
async-openai = { version = "0.43", default-features = false, features = ["responses"] }
argon2 = "0.5"
axum = "0.8"
axum-login = "0.18"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "request-id", "timeout", "trace"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
