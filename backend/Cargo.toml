[workspace]
members = [
    "crates/api",
    "crates/application",
    "crates/domain",
    "crates/infrastructure",
    "crates/persistence",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4"] }
