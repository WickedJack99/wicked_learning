openapi: 3.1.1
info:
  title: Wicked Learning API
  version: 1.0.0-draft
  description: |
    The versioned contract between the React client and Rust/Axum API.
    The initial read-only public-information pages are available to prove the full React,
    contract, Axum and PostgreSQL path. User-facing writes and AI operations
    require a separately reviewed vertical slice.
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Report whether the API process is running.
      responses:
        '200':
          description: The API process is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report whether required databases are reachable.
      responses:
        '200':
          description: The API and both databases are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /session:
    get:
      operationId: getSessionStatus
      summary: Read the safe authentication state for the current browser session.
      responses:
        '200':
          description: Current session state without credential material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
  /me:
    get:
      operationId: getCurrentUser
      summary: Read the current authenticated subject and application roles.
      responses:
        '200':
          description: The opaque identity subject and roles currently granted by the application database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The identity has no application principal or role assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /learner/world:
    get:
      operationId: getLearnerWorld
      summary: Read the signed-in learner's authorized World snapshot and bounded progress summaries.
      responses:
        '200':
          description: Visible published maps plus only this learner's bookmarks and progress summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerWorldSnapshot'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The identity has no application principal or role assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No World map is visible to this learner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /learner/maps/{map_slug}/nodes/{node_slug}/bookmark:
    post:
      operationId: createLearnerNodeBookmark
      summary: Bookmark an accessible learner map node.
      parameters:
        - $ref: '#/components/parameters/MapSlug'
        - $ref: '#/components/parameters/NodeSlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The accessible bookmark set after the idempotent save.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerBookmarkResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The map node is unknown or not accessible to this learner. }
        '503': { description: The application database is unavailable. }
    delete:
      operationId: deleteLearnerNodeBookmark
      summary: Remove the current learner's bookmark for an accessible map node.
      parameters:
        - $ref: '#/components/parameters/MapSlug'
        - $ref: '#/components/parameters/NodeSlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The accessible bookmark set after the idempotent removal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerBookmarkResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The map node is unknown or not accessible to this learner. }
        '503': { description: The application database is unavailable. }
  /learner/journal:
    get:
      operationId: getLearnerJournal
      summary: Read a bounded page of the authenticated learner's private journal.
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 24, default: 4 }
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 160 }
      responses:
        '200':
          description: Only the current learner's private journal pages, ordered by recent update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerJournalDocument'
        '400':
          description: Pagination or search parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The identity has no application principal or role assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /learner/journal/pages:
    post:
      operationId: createLearnerJournalPage
      summary: Create a private manual journal page for the authenticated learner.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLearnerJournalPageRequest'
      responses:
        '200':
          description: The new private journal page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerJournalPageResponse'
        '400': { description: The page fields are invalid. }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '503': { description: The application database is unavailable. }
  /learner/journal/pages/{page_id}:
    patch:
      operationId: updateLearnerJournalPage
      summary: Update a private journal page owned by the authenticated learner.
      parameters:
        - $ref: '#/components/parameters/LearnerJournalPageId'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLearnerJournalPageRequest'
      responses:
        '200':
          description: The updated private journal page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerJournalPageResponse'
        '400': { description: The page fields are invalid. }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The journal page does not exist for this learner. }
        '503': { description: The application database is unavailable. }
    delete:
      operationId: deleteLearnerJournalPage
      summary: Delete a private journal page owned by the authenticated learner.
      parameters:
        - $ref: '#/components/parameters/LearnerJournalPageId'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The deleted private journal page identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteLearnerJournalPageResponse'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The journal page does not exist for this learner. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}:
    get:
      operationId: getLearnerPlayback
      summary: Read the current activity in an authorized active play run.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
      responses:
        '200':
          description: Server-authorized current activity and authored completion destination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerPlaybackDocument'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The identity has no application principal or role assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The run is unknown, completed, unavailable, or not owned by this learner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/complete:
    post:
      operationId: completeLearnerOpenPractice
      summary: Complete the current authorized open-practice activity in a play run.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The server advanced the run or completed it at an authored terminal activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerPlaybackCompletionResult'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The run/activity pair is stale, unavailable, not owned by this learner, or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/answer:
    post:
      operationId: answerLearnerQuestion
      summary: Answer the current authorized question in a play run.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerQuestionAnswerRequest'
      responses:
        '200':
          description: Server-evaluated answer feedback and authored transition label.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerQuestionAnswerResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The active run, question, or submitted choices are unavailable. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/reflection:
    post:
      operationId: saveLearnerReflection
      summary: Save a private reflection for the current authorized activity and advance its play run.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerReflectionRequest'
      responses:
        '200':
          description: The private reflection was stored and the server advanced or completed the active run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerReflectionResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The active run/activity pair is stale, unavailable, not owned by this learner, or the reflection is invalid. }
        '503': { description: The application database is unavailable. }
  /learner/activity-starts/{start_id}/start:
    post:
      operationId: startLearnerRoute
      summary: Start a new server-owned play run or resume the active run for an authorized activity start.
      parameters:
        - $ref: '#/components/parameters/ActivityStartId'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The server-authorized run to use for playback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerRouteRun'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The start is unpublished, not visible to this learner, or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /learner/activity-starts/{start_id}/reset:
    post:
      operationId: resetLearnerRoute
      summary: Discard the active in-progress state and create a new server-owned play run for an authorized activity start.
      parameters:
        - $ref: '#/components/parameters/ActivityStartId'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The replacement server-authorized run to use for playback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerRouteRun'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The start is unpublished, not visible to this learner, or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /session/login:
    post:
      operationId: createSession
      summary: Start a verified Rust-owned password session.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The authenticated session state. The server sets an HTTP-only session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '401':
          description: The email/password pair is invalid, inactive or unverified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many login attempts came from this client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The identity store is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /session/logout:
    post:
      operationId: deleteSession
      summary: End the current browser session.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '204':
          description: The session has been ended if one existed.
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The identity store is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /security/csrf:
    get:
      operationId: getCsrfToken
      summary: Issue a token for a subsequent same-origin unsafe browser request.
      responses:
        '200':
          description: A short-lived CSRF token. The matching protected cookie is set by the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '500':
          description: The token could not be issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/pages/{slug}:
    get:
      operationId: getPublicPage
      summary: Read a published public-information page.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
            maxLength: 80
      responses:
        '200':
          description: A published public-information page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPage'
        '404':
          description: No published page has this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/source-links:
    get:
      operationId: getPublicSourceLinks
      summary: Read the public source-code links for this fresh deployment.
      responses:
        '200':
          description: The original project link and any deployment-specific modified-source links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSourceLinks'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/world:
    get:
      operationId: getPublicWorld
      summary: Read the first published fresh learning world for anonymous exploration.
      responses:
        '200':
          description: A bounded world, its published maps and their published map assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWorld'
        '404':
          description: No public world has been published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/worlds/{world_slug}/maps/{map_slug}/assets/{asset_slug}:
    get:
      operationId: getPublicMapAsset
      summary: Read a published focusable map place and its bounded route previews.
      parameters:
        - $ref: '#/components/parameters/PublicSlugPathWorld'
        - $ref: '#/components/parameters/PublicSlugPathMap'
        - $ref: '#/components/parameters/PublicSlugPathAsset'
      responses:
        '200':
          description: A published focusable map asset with at most 12 published route previews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMapAssetDetail'
        '404':
          description: No matching published focusable map asset exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/worlds/{world_slug}/maps/{map_slug}/assets/{asset_slug}/routes/{route_slug}:
    get:
      operationId: getPublicRouteOutline
      summary: Read a published route and its bounded published activity outline.
      parameters:
        - $ref: '#/components/parameters/PublicSlugPathWorld'
        - $ref: '#/components/parameters/PublicSlugPathMap'
        - $ref: '#/components/parameters/PublicSlugPathAsset'
        - $ref: '#/components/parameters/PublicSlugPathRoute'
      responses:
        '200':
          description: A published route with at most 24 published activity outlines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRouteOutline'
        '404':
          description: No matching published route exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/search:
    get:
      operationId: searchPublicWorld
      summary: Search published public map assets with a bounded literal query.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        '200':
          description: At most 20 published map-asset matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSearch'
        '400':
          description: The query is absent, too short or too long.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token from `GET /security/csrf`; the request must also have the matching protected cookie and an allowed Origin.
      schema:
        type: string
    ActivityStartId:
      name: start_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LearnerJournalPageId:
      name: page_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MapSlug:
      name: map_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    NodeSlug:
      name: node_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PlayRunId:
      name: play_run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActivitySlug:
      name: activity_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PublicSlugPathWorld:
      name: world_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PublicSlugPathMap:
      name: map_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PublicSlugPathAsset:
      name: asset_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PublicSlugPathRoute:
      name: route_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      type: object
      additionalProperties: false
      required: [code, title]
      properties:
        code:
          type: string
          example: dependency_unavailable
        title:
          type: string
          example: A required service is unavailable.
    SessionStatus:
      type: object
      additionalProperties: false
      required: [authenticated, subject_id]
      properties:
        authenticated:
          type: boolean
        subject_id:
          type: [string, 'null']
          format: uuid
          description: Opaque Rust identity subject identifier, available only for an authenticated session.
    CurrentUser:
      type: object
      additionalProperties: false
      required: [email, subject_id, roles]
      properties:
        email:
          type: string
          format: email
          description: The authenticated subject's normalized sign-in address. It is never returned for another subject.
        subject_id:
          type: string
          format: uuid
          description: Opaque Rust-owned identity subject identifier.
        roles:
          type: array
          description: Application roles, not credentials or profile data.
          items:
            type: string
            enum: [platform_administrator]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: Send this value in the CSRF header defined by a future unsafe endpoint. It is not an authentication credential.
    PublicPage:
      type: object
