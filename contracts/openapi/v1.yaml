      responses:
        '200':
          description: The current durable obstacle state and remaining inventory after the item was placed or an already-filled slot was revisited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerItemObstacleResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The run, obstacle, configured slot, item, ownership, or lock is unavailable. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/item-obstacle/continue:
    post:
      operationId: continueLearnerItemObstacle
      summary: Evaluate the current authorized item obstacle and continue only when its source-defined slots are met.
      description: An unmet obstacle records the source-defined failed attempt and optional lock. A met obstacle is bound to this play run before ordinary completion can advance it.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The current durable obstacle state, including whether this request may complete the activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerItemObstacleResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The active item obstacle is unavailable, not owned by this learner's current run, or locked. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/use-obstacle-tool:
    post:
      operationId: useLearnerObstacleTool
      summary: Apply one owned tool to the current authorized source obstacle.
      description: The server resolves the current run, learner-owned public tool reference, authored allowed-tool list, and whether the source clear persists. It never accepts a tool database identifier.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerObstacleToolRequest'
      responses:
        '200':
          description: Whether the owned tool is useful and the current obstacle is resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerObstacleToolResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The run, obstacle, selected public tool, or ownership is unavailable. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/check-ins:
    post:
      operationId: recordLearnerActivityCheckIn
      summary: Record one private, optional reflection after a completed activity.
      description: The server derives the completed activity and its owner from the authorized play run; the browser cannot select another learner or activity.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerActivityCheckInRequest'
      responses:
        '200':
          description: The current learner's recorded private observation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerActivityCheckInResult'
        '400': { description: The selected phrase, direction, or private note is invalid. }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The run/activity pair is stale, unavailable, incomplete, or not owned by this learner. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/answer:
    post:
      operationId: answerLearnerQuestion
      summary: Answer the current authorized question in a play run.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerQuestionAnswerRequest'
      responses:
        '200':
          description: Server-evaluated answer feedback and authored transition label.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerQuestionAnswerResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The active run, question, or submitted choices are unavailable. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/recall:
    post:
      operationId: queueLearnerCurrentQuestionForRecall
      summary: Keep the current authorized question in the learner's private recall queue.
      description: The active question is derived from the opaque server-owned run. This command does not create route progress, alter an answer, or accept a browser-selected question.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The queued question. Repeating the command is idempotent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerRecallItem'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The active question/run pair is unavailable or not owned by this learner. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/reflection:
    post:
      operationId: saveLearnerReflection
      summary: Save a private reflection for the current authorized activity and advance its play run.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerReflectionRequest'
      responses:
        '200':
          description: The private reflection was stored and the server advanced or completed the active run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerReflectionResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The active run/activity pair is stale, unavailable, not owned by this learner, or the reflection is invalid. }
        '503': { description: The application database is unavailable. }
  /learner/activity-starts/{start_id}/start:
    post:
      operationId: startLearnerRoute
      summary: Start a new server-owned play run or resume the active run for an authorized activity start.
      parameters:
        - $ref: '#/components/parameters/ActivityStartId'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The server-authorized run to use for playback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerRouteRun'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The start is unpublished, not visible to this learner, or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /learner/activity-starts/{start_id}/reset:
    post:
      operationId: resetLearnerRoute
      summary: Discard the active in-progress state and create a new server-owned play run for an authorized activity start.
      parameters:
        - $ref: '#/components/parameters/ActivityStartId'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The replacement server-authorized run to use for playback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerRouteRun'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The start is unpublished, not visible to this learner, or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /session/login:
    post:
      operationId: createSession
      summary: Start a verified Rust-owned password session, optionally remembered for the source duration.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: "The authenticated session state. The server sets an HTTP-only session cookie; `remember: true` keeps it for the source's 400-day duration."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '401':
          description: The email/password pair is invalid, inactive or unverified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many login attempts came from this client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The identity store is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /password/forgot:
    post:
      operationId: requestPasswordResetLink
      summary: Send a source-compatible password reset link to an identity address.
      description: The Rust identity database stores one short-lived Argon2id-verified recovery token per identity. The browser never receives that token from this API; it is delivered only by the configured mail transport.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestPasswordResetLink' }
      responses:
        '200':
          description: A password reset message was accepted for delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetLinkResponse' }
        '403': { description: A valid same-origin CSRF request is required. }
        '422': { description: The address is malformed or has no recoverable identity. }
        '429': { description: A reset link was requested for this identity in the source sixty-second throttle window. }
        '503': { description: The identity database or configured mail transport is unavailable. }
  /password/reset:
    post:
      operationId: resetPasswordWithRecoveryLink
      summary: Replace an identity password using a source-compatible recovery link.
      description: A successful reset atomically consumes the short-lived recovery token and replaces the password verifier. Existing server-side sessions bound to the prior verifier cease to authenticate on their next request.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204': { description: The password was reset and the recovery link was consumed. }
        '403': { description: A valid same-origin CSRF request is required. }
        '422': { description: The recovery link is invalid or expired, or the replacement password is invalid. }
        '503': { description: The identity database is unavailable. }
  /session/logout:
    post:
      operationId: deleteSession
      summary: End the current browser session.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '204':
          description: The session has been ended if one existed.
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The identity store is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /security/csrf:
    get:
      operationId: getCsrfToken
      summary: Issue a token for a subsequent same-origin unsafe browser request.
      responses:
        '200':
          description: A short-lived CSRF token. The matching protected cookie is set by the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '500':
          description: The token could not be issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/pages/{slug}:
    get:
      operationId: getPublicPage
      summary: Read a published public-information page.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
            maxLength: 80
      responses:
        '200':
          description: A published public-information page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPage'
        '404':
          description: No published page has this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/presentation:
    get:
      operationId: getPublicPresentation
      summary: Read the safe, deployment-owned public presentation model.
      responses:
        '200':
          description: The resolved branding, public palette, base auth themes and welcome pages needed by the anonymous browser shell.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPresentation'
        '503':
          description: The application database is unavailable or the public presentation singleton is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/source-links:
    get:
      operationId: getPublicSourceLinks
      summary: Read the public source-code links for this fresh deployment.
      responses:
        '200':
          description: The original project link and any deployment-specific modified-source links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSourceLinks'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/world:
    get:
      operationId: getPublicWorld
      summary: Read the first published fresh learning world for anonymous exploration.
      responses:
        '200':
          description: A bounded world, its published maps and their published map assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWorld'
        '404':
          description: No public world has been published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/worlds/{world_slug}/maps/{map_slug}/assets/{asset_slug}:
    get:
      operationId: getPublicMapAsset
      summary: Read a published focusable map place and its bounded route previews.
      parameters:
        - $ref: '#/components/parameters/PublicSlugPathWorld'
        - $ref: '#/components/parameters/PublicSlugPathMap'
        - $ref: '#/components/parameters/PublicSlugPathAsset'
      responses:
        '200':
          description: A published focusable map asset with at most 12 published route previews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMapAssetDetail'
        '404':
          description: No matching published focusable map asset exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/worlds/{world_slug}/maps/{map_slug}/assets/{asset_slug}/routes/{route_slug}:
    get:
      operationId: getPublicRouteOutline
      summary: Read a published route and its bounded published activity outline.
      parameters:
        - $ref: '#/components/parameters/PublicSlugPathWorld'
        - $ref: '#/components/parameters/PublicSlugPathMap'
        - $ref: '#/components/parameters/PublicSlugPathAsset'
        - $ref: '#/components/parameters/PublicSlugPathRoute'
      responses:
        '200':
          description: A published route with at most 24 published activity outlines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRouteOutline'
        '404':
          description: No matching published route exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/search:
    get:
      operationId: searchPublicWorld
      summary: Search published public map assets with a bounded literal query.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        '200':
          description: At most 20 published map-asset matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSearch'
        '400':
          description: The query is absent, too short or too long.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token from `GET /security/csrf`; the request must also have the matching protected cookie and an allowed Origin.
      schema:
        type: string
    ActivityStartId:
      name: start_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LearnerJournalPageId:
      name: page_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LearnerGroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationSlug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9-]{1,140}$' }
    OrganizationJoinRequestId:
      name: request_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizationMembershipId:
      name: membership_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizationMessageId:
      name: message_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LearnerGroupMessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminLearningGroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccessLinkId:
      name: access_link_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LearningSupportTopicId:
      name: topic_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LearningSupportMessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LearningSupportResponseId:
      name: response_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MapSlug:
      name: map_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    TopicSlug:
      name: topic_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    NodeSlug:
      name: node_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PlayRunId:
      name: play_run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActivitySlug:
      name: activity_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
    RecallItemId:
      name: recall_item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        maxLength: 80
    PublicSlugPathWorld:
      name: world_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PublicSlugPathMap:
      name: map_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PublicSlugPathAsset:
      name: asset_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PublicSlugPathRoute:
      name: route_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
  schemas:
    CreateRegistrationTokenRequest:
      type: object
      additionalProperties: false
      properties:
        expires_at: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'], maxLength: 500 }
        roles:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 80 }
    CreateRegistrationTokenResponse:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string }
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      type: object
      additionalProperties: false
      required: [code, title]
      properties:
        code:
          type: string
          example: dependency_unavailable
        title:
          type: string
          example: A required service is unavailable.
    IdentityRegistrationRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, password_confirmation, registration_token]
      properties:
        appearance:
          type: string
          enum: [dark, light]
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
        password_confirmation:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
        registration_token:
          type: string
          minLength: 1
          maxLength: 120
    UpdateAccountPasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, password, password_confirmation]
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
        password_confirmation:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
    ConfirmAccountPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
    PasswordConfirmationStatus:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        confirmed:
          type: boolean
          description: Whether this browser's server-side session has a current password confirmation for sensitive actions.
    PasskeyOptions:
      type: object
      additionalProperties: false
      required: [options]
      properties:
        options:
          type: object
          additionalProperties: true
          description: WebAuthn public-key options serialized by webauthn-rs. The maintained browser WebAuthn library owns browser-side decoding and invocation.
    WebAuthnCredential:
      type: object
      additionalProperties: true
      required: [id, rawId, response, type]
      properties:
        id:
          type: string
          description: Base64url credential identifier produced by the browser WebAuthn API.
        rawId:
          type: string
          description: Base64url raw credential identifier produced by the browser WebAuthn API.
        type:
          type: string
          const: public-key
        response:
          type: object
          additionalProperties: true
          description: Browser-produced registration or assertion response fields. They are verified by webauthn-rs and are not application data.
        clientExtensionResults:
          type: object
          additionalProperties: true
    RegisterPasskeyRequest:
      type: object
      additionalProperties: false
      required: [credential, name]
      properties:
        credential:
          $ref: '#/components/schemas/WebAuthnCredential'
