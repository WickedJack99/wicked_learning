        '404': { description: The run/activity pair is stale, unavailable, incomplete, or not owned by this learner. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/answer:
    post:
      operationId: answerLearnerQuestion
      summary: Answer the current authorized question in a play run.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerQuestionAnswerRequest'
      responses:
        '200':
          description: Server-evaluated answer feedback and authored transition label.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerQuestionAnswerResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The active run, question, or submitted choices are unavailable. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/recall:
    post:
      operationId: queueLearnerCurrentQuestionForRecall
      summary: Keep the current authorized question in the learner's private recall queue.
      description: The active question is derived from the opaque server-owned run. This command does not create route progress, alter an answer, or accept a browser-selected question.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The queued question. Repeating the command is idempotent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerRecallItem'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The active question/run pair is unavailable or not owned by this learner. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/reflection:
    post:
      operationId: saveLearnerReflection
      summary: Save a private reflection for the current authorized activity and advance its play run.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerReflectionRequest'
      responses:
        '200':
          description: The private reflection was stored and the server advanced or completed the active run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerReflectionResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The active run/activity pair is stale, unavailable, not owned by this learner, or the reflection is invalid. }
        '503': { description: The application database is unavailable. }
  /learner/activity-starts/{start_id}/start:
    post:
      operationId: startLearnerRoute
      summary: Start a new server-owned play run or resume the active run for an authorized activity start.
      parameters:
        - $ref: '#/components/parameters/ActivityStartId'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The server-authorized run to use for playback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerRouteRun'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The start is unpublished, not visible to this learner, or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /learner/activity-starts/{start_id}/reset:
    post:
      operationId: resetLearnerRoute
      summary: Discard the active in-progress state and create a new server-owned play run for an authorized activity start.
      parameters:
        - $ref: '#/components/parameters/ActivityStartId'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The replacement server-authorized run to use for playback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerRouteRun'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The start is unpublished, not visible to this learner, or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /session/login:
    post:
      operationId: createSession
      summary: Start a verified Rust-owned password session, optionally remembered for the source duration.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: "The authenticated session state. The server sets an HTTP-only session cookie; `remember: true` keeps it for the source's 400-day duration."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '401':
          description: The email/password pair is invalid, inactive or unverified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many login attempts came from this client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The identity store is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /password/forgot:
    post:
      operationId: requestPasswordResetLink
      summary: Send a source-compatible password reset link to an identity address.
      description: The Rust identity database stores one short-lived Argon2id-verified recovery token per identity. The browser never receives that token from this API; it is delivered only by the configured mail transport.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestPasswordResetLink' }
      responses:
        '200':
          description: A password reset message was accepted for delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetLinkResponse' }
        '403': { description: A valid same-origin CSRF request is required. }
        '422': { description: The address is malformed or has no recoverable identity. }
        '429': { description: A reset link was requested for this identity in the source sixty-second throttle window. }
        '503': { description: The identity database or configured mail transport is unavailable. }
  /password/reset:
    post:
      operationId: resetPasswordWithRecoveryLink
      summary: Replace an identity password using a source-compatible recovery link.
      description: A successful reset atomically consumes the short-lived recovery token and replaces the password verifier. Existing server-side sessions bound to the prior verifier cease to authenticate on their next request.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204': { description: The password was reset and the recovery link was consumed. }
        '403': { description: A valid same-origin CSRF request is required. }
        '422': { description: The recovery link is invalid or expired, or the replacement password is invalid. }
        '503': { description: The identity database is unavailable. }
  /session/logout:
    post:
      operationId: deleteSession
      summary: End the current browser session.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '204':
          description: The session has been ended if one existed.
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The identity store is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /security/csrf:
    get:
      operationId: getCsrfToken
      summary: Issue a token for a subsequent same-origin unsafe browser request.
      responses:
        '200':
          description: A short-lived CSRF token. The matching protected cookie is set by the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '500':
          description: The token could not be issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/pages/{slug}:
    get:
      operationId: getPublicPage
      summary: Read a published public-information page.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
            maxLength: 80
      responses:
        '200':
          description: A published public-information page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPage'
        '404':
          description: No published page has this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/presentation:
    get:
      operationId: getPublicPresentation
      summary: Read the safe, deployment-owned public presentation model.
      responses:
        '200':
          description: The resolved branding, public palette, base auth themes and welcome pages needed by the anonymous browser shell.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPresentation'
        '503':
          description: The application database is unavailable or the public presentation singleton is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/source-links:
    get:
      operationId: getPublicSourceLinks
      summary: Read the public source-code links for this fresh deployment.
      responses:
        '200':
          description: The original project link and any deployment-specific modified-source links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSourceLinks'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/world:
    get:
      operationId: getPublicWorld
      summary: Read the first published fresh learning world for anonymous exploration.
      responses:
        '200':
          description: A bounded world, its published maps and their published map assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWorld'
        '404':
          description: No public world has been published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/worlds/{world_slug}/maps/{map_slug}/assets/{asset_slug}:
    get:
      operationId: getPublicMapAsset
      summary: Read a published focusable map place and its bounded route previews.
      parameters:
        - $ref: '#/components/parameters/PublicSlugPathWorld'
        - $ref: '#/components/parameters/PublicSlugPathMap'
        - $ref: '#/components/parameters/PublicSlugPathAsset'
      responses:
        '200':
          description: A published focusable map asset with at most 12 published route previews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMapAssetDetail'
        '404':
          description: No matching published focusable map asset exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/worlds/{world_slug}/maps/{map_slug}/assets/{asset_slug}/routes/{route_slug}:
    get:
      operationId: getPublicRouteOutline
      summary: Read a published route and its bounded published activity outline.
      parameters:
        - $ref: '#/components/parameters/PublicSlugPathWorld'
        - $ref: '#/components/parameters/PublicSlugPathMap'
        - $ref: '#/components/parameters/PublicSlugPathAsset'
        - $ref: '#/components/parameters/PublicSlugPathRoute'
      responses:
        '200':
          description: A published route with at most 24 published activity outlines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRouteOutline'
        '404':
          description: No matching published route exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/search:
    get:
      operationId: searchPublicWorld
      summary: Search published public map assets with a bounded literal query.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        '200':
          description: At most 20 published map-asset matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSearch'
        '400':
          description: The query is absent, too short or too long.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token from `GET /security/csrf`; the request must also have the matching protected cookie and an allowed Origin.
      schema:
        type: string
    ActivityStartId:
      name: start_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LearnerJournalPageId:
      name: page_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LearnerGroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationSlug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9-]{1,140}$' }
    OrganizationJoinRequestId:
      name: request_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizationMembershipId:
      name: membership_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizationMessageId:
      name: message_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LearnerGroupMessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminLearningGroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccessLinkId:
      name: access_link_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LearningSupportTopicId:
      name: topic_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LearningSupportMessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LearningSupportResponseId:
      name: response_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MapSlug:
      name: map_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    TopicSlug:
      name: topic_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    NodeSlug:
      name: node_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PlayRunId:
      name: play_run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActivitySlug:
      name: activity_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
    RecallItemId:
      name: recall_item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        maxLength: 80
    PublicSlugPathWorld:
      name: world_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PublicSlugPathMap:
      name: map_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PublicSlugPathAsset:
      name: asset_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PublicSlugPathRoute:
      name: route_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
  schemas:
    CreateContentApiMapAssetRequest:
      type: object
      additionalProperties: false
      required: [title, position_x, position_y, position_z, width, opacity, interaction_mode]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        image_url: { type: [string, 'null'], maxLength: 2048 }
        text: { type: [string, 'null'], maxLength: 255 }
        position_x: { type: number, minimum: 0, maximum: 100 }
        position_y: { type: number, minimum: 0, maximum: 100 }
        position_z: { type: integer, minimum: -10000, maximum: 10000 }
        width: { type: number, minimum: 1, maximum: 100 }
        opacity: { type: number, minimum: 0, maximum: 1 }
        locked: { type: boolean, default: false }
        interaction_mode: { type: string, enum: [focusable, decorative, hide_on_hover, toggle] }
        interaction_config: { type: object, additionalProperties: true }
        visual_config: { type: object, additionalProperties: true }
        sound_config: { type: object, additionalProperties: true }
    ContentApiMapAsset:
      type: object
      additionalProperties: false
      required: [id, mapId, title, description, imageUrl, text, position, width, opacity, locked, interactionMode, interactionConfig, visualConfig, soundConfig, activityCount]
      properties:
        id: { type: string, format: uuid }
        mapId: { type: string, format: uuid }
        title: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        imageUrl: { type: [string, 'null'] }
        text: { type: [string, 'null'] }
        position:
          type: object
          additionalProperties: false
          required: [x, y, z]
          properties:
            x: { type: number }
            y: { type: number }
            z: { type: integer }
        width: { type: number, minimum: 0 }
        opacity: { type: number, minimum: 0, maximum: 1 }
        locked: { type: boolean }
        interactionMode: { type: string, enum: [focusable, decorative, hide_on_hover, toggle] }
        interactionConfig: { type: object, additionalProperties: true }
        visualConfig: { type: object, additionalProperties: true }
        soundConfig: { type: object, additionalProperties: true }
        activityCount: { type: integer, minimum: 0 }
    ContentApiMapAssetResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ContentApiMapAsset' }
    ContentApiActivity:
      type: object
      additionalProperties: false
      required: [id, mapAssetId, slug, type, title, introduction, config, position]
      properties:
        id: { type: string, format: uuid }
        mapAssetId: { type: string, format: uuid }
        slug: { type: string, pattern: '^[a-z0-9-]+$' }
        type: { type: string }
        title: { type: string }
        introduction: { type: [string, 'null'] }
        config: { type: object, additionalProperties: true }
        position:
          type: object
          additionalProperties: false
          required: [x, y]
          properties:
            x: { type: [number, 'null'] }
            y: { type: [number, 'null'] }
    ContentApiActivityResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ContentApiActivity' }
    CreateContentApiActivityRequest:
      type: object
      additionalProperties: false
      required: [type, title]
      properties:
        type: { type: string, enum: [reflection, review, open_practice, markdown] }
        title: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: [string, 'null'], maxLength: 140, pattern: '^[a-z0-9-]+$' }
        introduction: { type: [string, 'null'], maxLength: 1000 }
        reflection_prompt: { type: [string, 'null'], maxLength: 4000 }
        reflection_note: { type: [string, 'null'], maxLength: 2000 }
        reflection_topic: { type: [string, 'null'], maxLength: 160 }
        reflection_subtopic: { type: [string, 'null'], maxLength: 160 }
        open_practice_next_step: { type: [string, 'null'], maxLength: 4000 }
        markdown_pages:
          type: [array, 'null']
          maxItems: 30
          items: { $ref: '#/components/schemas/MarkdownActivityPage' }
        markdown_transitions:
          type: [array, 'null']
          maxItems: 60
          items: { $ref: '#/components/schemas/MarkdownActivityTransition' }
        markdown_graph_layout:
          anyOf:
            - $ref: '#/components/schemas/MarkdownActivityGraphLayout'
            - type: 'null'
        graph_position_x: { type: [integer, 'null'] }
        graph_position_y: { type: [integer, 'null'] }
    CreateRegistrationTokenRequest:
      type: object
      additionalProperties: false
      properties:
        expires_at: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'], maxLength: 500 }
        roles:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 80 }
    CreateRegistrationTokenResponse:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string }
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      type: object
      additionalProperties: false
      required: [code, title]
      properties:
        code:
          type: string
          example: dependency_unavailable
        title:
          type: string
          example: A required service is unavailable.
    IdentityRegistrationRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, password_confirmation, registration_token]
      properties:
        appearance:
          type: string
          enum: [dark, light]
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
        password_confirmation:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
        registration_token:
          type: string
          minLength: 1
          maxLength: 120
    UpdateAccountPasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, password, password_confirmation]
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
        password_confirmation:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
    ConfirmAccountPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
    PasswordConfirmationStatus:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        confirmed:
          type: boolean
          description: Whether this browser's server-side session has a current password confirmation for sensitive actions.
    PasskeyOptions:
      type: object
      additionalProperties: false
      required: [options]
      properties:
        options:
          type: object
          additionalProperties: true
          description: WebAuthn public-key options serialized by webauthn-rs. The maintained browser WebAuthn library owns browser-side decoding and invocation.
    WebAuthnCredential:
      type: object
      additionalProperties: true
      required: [id, rawId, response, type]
      properties:
        id:
          type: string
          description: Base64url credential identifier produced by the browser WebAuthn API.
        rawId:
          type: string
          description: Base64url raw credential identifier produced by the browser WebAuthn API.
        type:
          type: string
          const: public-key
        response:
          type: object
          additionalProperties: true
          description: Browser-produced registration or assertion response fields. They are verified by webauthn-rs and are not application data.
        clientExtensionResults:
          type: object
          additionalProperties: true
    RegisterPasskeyRequest:
      type: object
      additionalProperties: false
      required: [credential, name]
      properties:
        credential:
          $ref: '#/components/schemas/WebAuthnCredential'
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Owner-visible source-shaped label for identifying this passkey.
    PasskeySummary:
      type: object
      additionalProperties: false
      required: [authenticator, created_at, id, last_used_at, name]
      properties:
        authenticator:
          type: [string, 'null']
          description: Optional authenticator label when safely known. This initial WebAuthn adapter deliberately does not infer an unverified device brand.
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        last_used_at:
          type: [string, 'null']
          format: date-time
        name:
          type: string
          minLength: 1
          maxLength: 255
    TwoFactorStatus:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Whether the authenticated subject has a confirmed authenticator-app factor.
    PendingTwoFactorSetup:
      type: object
      additionalProperties: false
      required: [manual_setup_key, provisioning_url]
      properties:
        manual_setup_key:
          type: string
          description: A Base32 authenticator secret. It is returned once for the current pending enrollment and must not be persisted by a client.
        provisioning_url:
          type: string
          format: uri
          description: A standard otpauth URI containing the pending secret. It is returned only to the authenticated owner and must not be persisted by a client.
    ConfirmTwoFactorSetupRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
    RecoveryCodes:
      type: object
      additionalProperties: false
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            minLength: 24
            maxLength: 24
            pattern: '^[A-Za-z0-9_-]{24}$'
          description: One-use recovery codes, returned only when enrollment is confirmed. The client must show them once and must not persist them.
    AccountProfile:
      type: object
      additionalProperties: false
      required: [name, email, username, profile_image_id, profile_image_url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        username:
          type: [string, 'null']
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_-]+$'
        profile_image_id:
          type: [string, 'null']
          format: uuid
        profile_image_url:
          type: [string, 'null']
          pattern: '^/api/v1/profile-images/[0-9a-f-]{36}$'
    UpdateAccountProfileRequest:
      type: object
      additionalProperties: false
      required: [name, email, profile_image_id]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        username:
          type: [string, 'null']
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_-]+$'
        profile_image_id:
          type: [string, 'null']
          format: uuid
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: The authenticated account owner's current password. It is never persisted or returned.
    ProfileImageUpload:
      type: object
      additionalProperties: false
      required: [profile_image_id, url]
      properties:
        profile_image_id:
          type: string
          format: uuid
        url:
          type: string
          pattern: '^/api/v1/profile-images/[0-9a-f-]{36}$'
    TwoFactorChallengeRequest:
      type: object
      additionalProperties: false
      description: Submit exactly one authenticator-app code or one unused recovery code.
      oneOf:
        - required: [code]
        - required: [recovery_code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
        recovery_code:
          type: string
          minLength: 1
          maxLength: 128
    SessionStatus:
      type: object
      additionalProperties: false
      required: [authenticated, subject_id, two_factor_required]
      properties:
        authenticated:
          type: boolean
        subject_id:
          type: [string, 'null']
          format: uuid
          description: Opaque Rust identity subject identifier, available only for an authenticated session.
        two_factor_required:
          type: boolean
          description: Password verification succeeded, but this browser must complete the server-side two-factor challenge before a session is authenticated.
    CurrentUser:
      type: object
      additionalProperties: false
      required: [appearance, capabilities, email, subject_id, roles]
      properties:
        appearance:
          type: string
          enum: [dark, light]
          description: The authenticated learner's private visual preference.
        email:
          type: string
          format: email
          description: The authenticated subject's normalized sign-in address. It is never returned for another subject.
        capabilities:
          type: array
          description: Server-owned application capabilities granted through the current subject's roles; never credentials or identity data.
          items:
            type: string
            enum: [access_links_manage, journal_feedback_policy_manage, journal_feedback_review, journal_feedback_view, learner_messages_moderate, learning_groups_manage, organization_icons_moderate, platform_feedback_review, platform_feedback_view]
        subject_id:
          type: string
          format: uuid
          description: Opaque Rust-owned identity subject identifier.
        roles:
          type: array
          description: Application roles, not credentials or profile data.
          items:
            type: string
            enum: [learner, learning_support, platform_administrator]
