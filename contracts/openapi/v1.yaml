openapi: 3.1.1
info:
  title: Wicked Learning API
  version: 1.0.0-draft
  description: |
    The versioned contract between the React client and Rust/Axum API.
    The initial read-only public-information pages are available to prove the full React,
    contract, Axum and PostgreSQL path. User-facing writes and AI operations
    require a separately reviewed vertical slice.
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Report whether the API process is running.
      responses:
        '200':
          description: The API process is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report whether required databases are reachable.
      responses:
        '200':
          description: The API and both databases are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /session:
    get:
      operationId: getSessionStatus
      summary: Read the safe authentication state for the current browser session.
      responses:
        '200':
          description: Current session state without credential material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
  /me:
    get:
      operationId: getCurrentUser
      summary: Read the current authenticated subject and application roles.
      responses:
        '200':
          description: The opaque identity subject and roles currently granted by the application database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The identity has no application principal or role assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /learner/world:
    get:
      operationId: getLearnerWorld
      summary: Read the signed-in learner's authorized World snapshot and bounded progress summaries.
      responses:
        '200':
          description: Visible published maps plus only this learner's bookmarks and progress summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerWorldSnapshot'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The identity has no application principal or role assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No World map is visible to this learner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /learner/maps/{map_slug}/nodes/{node_slug}/bookmark:
    post:
      operationId: createLearnerNodeBookmark
      summary: Bookmark an accessible learner map node.
      parameters:
        - $ref: '#/components/parameters/MapSlug'
        - $ref: '#/components/parameters/NodeSlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The accessible bookmark set after the idempotent save.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerBookmarkResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The map node is unknown or not accessible to this learner. }
        '503': { description: The application database is unavailable. }
    delete:
      operationId: deleteLearnerNodeBookmark
      summary: Remove the current learner's bookmark for an accessible map node.
      parameters:
        - $ref: '#/components/parameters/MapSlug'
        - $ref: '#/components/parameters/NodeSlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The accessible bookmark set after the idempotent removal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerBookmarkResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The map node is unknown or not accessible to this learner. }
        '503': { description: The application database is unavailable. }
  /learner/maps/{map_slug}/nodes/{node_slug}/use-tool:
    post:
      operationId: useLearnerToolOnNode
      summary: Use one of the signed-in learner's owned tools on an accessible World node.
      parameters:
        - $ref: '#/components/parameters/MapSlug'
        - $ref: '#/components/parameters/NodeSlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerNodeToolRequest'
      responses:
        '200':
          description: The source-defined result of the equipped-tool attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerNodeToolResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The map node is unknown, inaccessible, or the tool is not owned by this learner. }
        '503': { description: The application database is unavailable. }
  /learner/bookmarks:
    get:
      operationId: getLearnerBookmarkMap
      summary: Read the signed-in learner's source-defined personal bookmark map.
      responses:
        '200':
          description: Visible bookmarks with their original map context and presentation assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerBookmarkMap'
        '401': { description: Authentication is required. }
        '403': { description: The current identity has no learner application principal. }
        '503': { description: The application database is unavailable. }
  /learner/competence:
    get:
      operationId: getLearnerCompetenceMap
      summary: Read the current learner's private qualitative evidence map.
      responses:
        '200':
          description: A bounded qualitative evidence and topic-transition view for the authenticated learner only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerCompetenceMap'
        '401': { description: Authentication is required. }
        '403': { description: The current identity has no learner application principal. }
        '503': { description: The application database is unavailable. }
  /learner/topics:
    get:
      operationId: getLearnerTopicDirectory
      summary: Read a bounded, authenticated directory of published topic areas.
      parameters:
        - name: area
          in: query
          schema: { type: string, pattern: '^[a-z0-9-]+$', maxLength: 80 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000 }
        - name: search
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Published root topics in the selected area, with visible-map counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerTopicDirectory'
        '400': { description: Directory query parameters are invalid. }
        '401': { description: Authentication is required. }
        '403': { description: The current identity has no learner application principal. }
        '503': { description: The application database is unavailable. }
  /learner/paths:
    get:
      operationId: getLearnerPaths
      summary: Read source-defined, currently eligible learner paths.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: purpose
          in: query
          schema: { type: string, enum: [apply, explain, participate, reflect, retrieve, review, transfer] }
        - name: time
          in: query
          schema: { type: integer, enum: [15, 30] }
        - name: topic
          in: query
          schema: { type: string, pattern: '^[a-z0-9-]+$', maxLength: 80 }
      responses:
        '200':
          description: Bounded paths from visible maps and currently playable nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerPaths'
        '401': { description: Authentication is required. }
        '403': { description: The current identity has no learner application principal. }
        '503': { description: The application database is unavailable. }
  /learner/topics/{topic_slug}/overview:
    get:
      operationId: getLearnerTopicOverview
      summary: Read the authenticated learner's published topic overview and bounded subtopics.
      parameters:
        - $ref: '#/components/parameters/TopicSlug'
        - name: subtopics_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        '200':
          description: A published topic's source-defined overview section.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerTopicOverview'
        '400': { description: The topic or pagination parameter is invalid. }
        '401': { description: Authentication is required. }
        '403': { description: The current identity has no learner application principal. }
        '404': { description: The requested topic is unpublished or does not exist. }
        '503': { description: The application database is unavailable. }
  /learner/topics/{topic_slug}/trail:
    get:
      operationId: getLearnerTopicTrail
      summary: Read the authenticated learner's bounded private trail for a published topic.
      parameters:
        - $ref: '#/components/parameters/TopicSlug'
      responses:
        '200':
          description: A source-defined topic Trail scoped to the current learner and currently visible maps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerTopicTrail'
        '400': { description: The topic parameter is invalid. }
        '401': { description: Authentication is required. }
        '403': { description: The current identity has no learner application principal. }
        '404': { description: The requested topic is unpublished or does not exist. }
        '503': { description: The application database is unavailable. }
  /learner/topics/{topic_slug}/maps:
    get:
      operationId: getLearnerTopicMaps
      summary: Read the authenticated learner's visible maps for a published topic.
      parameters:
        - $ref: '#/components/parameters/TopicSlug'
        - name: maps_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        '200':
          description: A published topic's source-defined Maps section, scoped to visible maps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerTopicMaps'
        '400': { description: The topic or pagination parameter is invalid. }
        '401': { description: Authentication is required. }
        '403': { description: The current identity has no learner application principal. }
        '404': { description: The requested topic is unpublished or does not exist. }
        '503': { description: The application database is unavailable. }
  /learner/journal:
    get:
      operationId: getLearnerJournal
      summary: Read a bounded page of the authenticated learner's private journal.
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 24, default: 4 }
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 160 }
      responses:
        '200':
          description: Only the current learner's private journal pages, ordered by recent update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerJournalDocument'
        '400':
          description: Pagination or search parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The identity has no application principal or role assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /learner/revisit-invitations/{check_in_id}:
    post:
      operationId: updateLearnerRevisitInvitation
      summary: Defer or hide a due private revisit invitation.
      parameters:
        - name: check_in_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLearnerRevisitInvitationRequest'
      responses:
        '200':
          description: The invitation has been deferred or hidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerRevisitInvitationActionResult'
        '400': { description: The invitation action is invalid. }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The due, visible invitation is unavailable or not owned by this learner. }
        '503': { description: The application database is unavailable. }
  /learner/revisit-invitations/{check_in_id}/open:
    post:
      operationId: openLearnerRevisitInvitation
      summary: Open or resume an authorized due private revisit.
      description: The server derives the invited activity and opaque playback run from the authenticated learner's due invitation. The browser cannot choose an activity, route start, or revisit mode.
      parameters:
        - name: check_in_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The server-owned revisit run is ready for the existing playback endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerRevisitRun'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The due, visible invitation is unavailable or not owned by this learner. }
        '503': { description: The application database is unavailable. }
  /learner/journal/pages:
    post:
      operationId: createLearnerJournalPage
      summary: Create a private manual journal page for the authenticated learner.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLearnerJournalPageRequest'
      responses:
        '200':
          description: The new private journal page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerJournalPageResponse'
        '400': { description: The page fields are invalid. }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '503': { description: The application database is unavailable. }
  /learner/journal/pages/{page_id}:
    patch:
      operationId: updateLearnerJournalPage
      summary: Update a private journal page owned by the authenticated learner.
      parameters:
        - $ref: '#/components/parameters/LearnerJournalPageId'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLearnerJournalPageRequest'
      responses:
        '200':
          description: The updated private journal page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerJournalPageResponse'
        '400': { description: The page fields are invalid. }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The journal page does not exist for this learner. }
        '503': { description: The application database is unavailable. }
    delete:
      operationId: deleteLearnerJournalPage
      summary: Delete a private journal page owned by the authenticated learner.
      parameters:
        - $ref: '#/components/parameters/LearnerJournalPageId'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The deleted private journal page identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteLearnerJournalPageResponse'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The journal page does not exist for this learner. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}:
    get:
      operationId: getLearnerPlayback
      summary: Read the current activity in an authorized active play run.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
      responses:
        '200':
          description: Server-authorized current activity and authored completion destination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerPlaybackDocument'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The identity has no application principal or role assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The run is unknown, completed, unavailable, or not owned by this learner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/complete:
    post:
      operationId: completeLearnerCurrentActivity
      summary: Complete the current authorized simple activity in a play run.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The server advanced the run or completed it at an authored terminal activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerPlaybackCompletionResult'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The run/activity pair is stale, unavailable, not owned by this learner, or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/grant-tool:
    post:
      operationId: grantLearnerTool
      summary: Claim the one configured tool from the current authorized tool-grant activity.
      description: The server resolves the active run, activity, configured tool and learner identity. It does not accept a browser-selected tool.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The configured tool is now owned by this learner, or was already owned after an interrupted attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerToolGrantResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The active tool-grant activity or configured tool is unavailable or not owned by this learner's current run. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/grant-items:
    post:
      operationId: grantLearnerItems
      summary: Roll and apply the configured items for the current authorized item-grant activity.
      description: The server resolves the active run, activity, chance and configured public item references. It does not accept a browser-selected item or quantity; repeats return the one persisted roll for this run.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The run's item-grant result, including any source-configured display items after a successful roll.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerItemGrantResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The active item-grant activity is unavailable or not owned by this learner's current run. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/item-obstacle-slots/{slot_index}:
    post:
      operationId: placeLearnerItemObstacleItem
      summary: Place one owned item into the configured slot of the current authorized item obstacle.
      description: The server resolves the current run, obstacle, expected public item reference, lock state and owned quantity. It never accepts a browser-selected database identifier or quantity.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - name: slot_index
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 9 }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerItemObstaclePlaceRequest'
      responses:
        '200':
          description: The current durable obstacle state and remaining inventory after the item was placed or an already-filled slot was revisited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerItemObstacleResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The run, obstacle, configured slot, item, ownership, or lock is unavailable. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/item-obstacle/continue:
    post:
      operationId: continueLearnerItemObstacle
      summary: Evaluate the current authorized item obstacle and continue only when its source-defined slots are met.
      description: An unmet obstacle records the source-defined failed attempt and optional lock. A met obstacle is bound to this play run before ordinary completion can advance it.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The current durable obstacle state, including whether this request may complete the activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerItemObstacleResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The active item obstacle is unavailable, not owned by this learner's current run, or locked. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/use-obstacle-tool:
    post:
      operationId: useLearnerObstacleTool
      summary: Apply one owned tool to the current authorized source obstacle.
      description: The server resolves the current run, learner-owned public tool reference, authored allowed-tool list, and whether the source clear persists. It never accepts a tool database identifier.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerObstacleToolRequest'
      responses:
        '200':
          description: Whether the owned tool is useful and the current obstacle is resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerObstacleToolResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The run, obstacle, selected public tool, or ownership is unavailable. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/check-ins:
    post:
      operationId: recordLearnerActivityCheckIn
      summary: Record one private, optional reflection after a completed activity.
      description: The server derives the completed activity and its owner from the authorized play run; the browser cannot select another learner or activity.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerActivityCheckInRequest'
      responses:
        '200':
          description: The current learner's recorded private observation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerActivityCheckInResult'
        '400': { description: The selected phrase, direction, or private note is invalid. }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The run/activity pair is stale, unavailable, incomplete, or not owned by this learner. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/answer:
    post:
      operationId: answerLearnerQuestion
      summary: Answer the current authorized question in a play run.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerQuestionAnswerRequest'
      responses:
        '200':
          description: Server-evaluated answer feedback and authored transition label.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerQuestionAnswerResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The active run, question, or submitted choices are unavailable. }
        '503': { description: The application database is unavailable. }
  /learner/play-runs/{play_run_id}/activities/{activity_slug}/reflection:
    post:
      operationId: saveLearnerReflection
      summary: Save a private reflection for the current authorized activity and advance its play run.
      parameters:
        - $ref: '#/components/parameters/PlayRunId'
        - $ref: '#/components/parameters/ActivitySlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerReflectionRequest'
      responses:
        '200':
          description: The private reflection was stored and the server advanced or completed the active run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerReflectionResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The active run/activity pair is stale, unavailable, not owned by this learner, or the reflection is invalid. }
        '503': { description: The application database is unavailable. }
  /learner/activity-starts/{start_id}/start:
    post:
      operationId: startLearnerRoute
      summary: Start a new server-owned play run or resume the active run for an authorized activity start.
      parameters:
        - $ref: '#/components/parameters/ActivityStartId'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The server-authorized run to use for playback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerRouteRun'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The start is unpublished, not visible to this learner, or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /learner/activity-starts/{start_id}/reset:
    post:
      operationId: resetLearnerRoute
      summary: Discard the active in-progress state and create a new server-owned play run for an authorized activity start.
      parameters:
        - $ref: '#/components/parameters/ActivityStartId'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The replacement server-authorized run to use for playback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerRouteRun'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The start is unpublished, not visible to this learner, or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /session/login:
    post:
      operationId: createSession
      summary: Start a verified Rust-owned password session.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The authenticated session state. The server sets an HTTP-only session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '401':
          description: The email/password pair is invalid, inactive or unverified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many login attempts came from this client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The identity store is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /session/logout:
    post:
      operationId: deleteSession
      summary: End the current browser session.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '204':
          description: The session has been ended if one existed.
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The identity store is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /security/csrf:
    get:
      operationId: getCsrfToken
      summary: Issue a token for a subsequent same-origin unsafe browser request.
      responses:
        '200':
          description: A short-lived CSRF token. The matching protected cookie is set by the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '500':
          description: The token could not be issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/pages/{slug}:
    get:
      operationId: getPublicPage
      summary: Read a published public-information page.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
            maxLength: 80
      responses:
        '200':
          description: A published public-information page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPage'
        '404':
          description: No published page has this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/presentation:
    get:
      operationId: getPublicPresentation
      summary: Read the safe, deployment-owned public presentation model.
      responses:
        '200':
          description: The resolved branding, public palette, base auth themes and welcome pages needed by the anonymous browser shell.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPresentation'
        '503':
          description: The application database is unavailable or the public presentation singleton is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/source-links:
    get:
      operationId: getPublicSourceLinks
      summary: Read the public source-code links for this fresh deployment.
      responses:
        '200':
          description: The original project link and any deployment-specific modified-source links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSourceLinks'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/world:
    get:
      operationId: getPublicWorld
      summary: Read the first published fresh learning world for anonymous exploration.
      responses:
        '200':
          description: A bounded world, its published maps and their published map assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWorld'
        '404':
          description: No public world has been published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/worlds/{world_slug}/maps/{map_slug}/assets/{asset_slug}:
    get:
      operationId: getPublicMapAsset
      summary: Read a published focusable map place and its bounded route previews.
      parameters:
        - $ref: '#/components/parameters/PublicSlugPathWorld'
        - $ref: '#/components/parameters/PublicSlugPathMap'
        - $ref: '#/components/parameters/PublicSlugPathAsset'
      responses:
        '200':
          description: A published focusable map asset with at most 12 published route previews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMapAssetDetail'
        '404':
          description: No matching published focusable map asset exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/worlds/{world_slug}/maps/{map_slug}/assets/{asset_slug}/routes/{route_slug}:
    get:
      operationId: getPublicRouteOutline
      summary: Read a published route and its bounded published activity outline.
      parameters:
        - $ref: '#/components/parameters/PublicSlugPathWorld'
        - $ref: '#/components/parameters/PublicSlugPathMap'
        - $ref: '#/components/parameters/PublicSlugPathAsset'
        - $ref: '#/components/parameters/PublicSlugPathRoute'
      responses:
        '200':
          description: A published route with at most 24 published activity outlines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRouteOutline'
        '404':
          description: No matching published route exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/search:
    get:
      operationId: searchPublicWorld
      summary: Search published public map assets with a bounded literal query.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        '200':
          description: At most 20 published map-asset matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSearch'
        '400':
          description: The query is absent, too short or too long.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token from `GET /security/csrf`; the request must also have the matching protected cookie and an allowed Origin.
      schema:
        type: string
    ActivityStartId:
      name: start_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LearnerJournalPageId:
      name: page_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MapSlug:
      name: map_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    TopicSlug:
      name: topic_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    NodeSlug:
      name: node_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PlayRunId:
      name: play_run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActivitySlug:
      name: activity_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PublicSlugPathWorld:
      name: world_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PublicSlugPathMap:
      name: map_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PublicSlugPathAsset:
      name: asset_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PublicSlugPathRoute:
      name: route_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      type: object
      additionalProperties: false
      required: [code, title]
      properties:
        code:
          type: string
          example: dependency_unavailable
        title:
          type: string
          example: A required service is unavailable.
    SessionStatus:
      type: object
      additionalProperties: false
      required: [authenticated, subject_id]
      properties:
        authenticated:
          type: boolean
        subject_id:
          type: [string, 'null']
          format: uuid
          description: Opaque Rust identity subject identifier, available only for an authenticated session.
    CurrentUser:
      type: object
      additionalProperties: false
      required: [email, subject_id, roles]
      properties:
        email:
          type: string
          format: email
          description: The authenticated subject's normalized sign-in address. It is never returned for another subject.
        subject_id:
          type: string
          format: uuid
          description: Opaque Rust-owned identity subject identifier.
        roles:
          type: array
          description: Application roles, not credentials or profile data.
          items:
            type: string
            enum: [platform_administrator]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: Send this value in the CSRF header defined by a future unsafe endpoint. It is not an authentication credential.
    PublicPage:
      type: object
      additionalProperties: false
      required: [slug, title, body]
      properties:
        slug:
          type: string
          example: about
        title:
          type: string
          example: About Wicked Learning
        body:
          type: string
          description: Plain text with paragraph breaks; the client must render it as text, not HTML.
    PublicPresentation:
      type: object
      additionalProperties: false
      required: [branding, auth, welcome, public_palette]
      properties:
        branding:
          $ref: '#/components/schemas/PublicBranding'
        auth:
          $ref: '#/components/schemas/PublicPresentationAuth'
        welcome:
          $ref: '#/components/schemas/PublicWelcome'
        public_palette:
          $ref: '#/components/schemas/PublicPaletteModes'
    PublicBranding:
      type: object
      additionalProperties: false
      required: [logo]
      properties:
        logo:
          type: string
          maxLength: 2048
          description: Deployment-provided logo URL or same-origin asset path.
    PublicPresentationAuth:
      type: object
      additionalProperties: false
      required: [login, welcome]
      properties:
        login:
          $ref: '#/components/schemas/PublicAppearanceThemes'
        welcome:
          $ref: '#/components/schemas/PublicAppearanceThemes'
    PublicAppearanceThemes:
      type: object
      additionalProperties: false
      required: [dark, light]
      properties:
        dark:
          $ref: '#/components/schemas/PublicAuthTheme'
        light:
          $ref: '#/components/schemas/PublicAuthTheme'
    PublicAuthTheme:
      type: object
      additionalProperties: false
      required: [background_color, background_image, background_overlay, border_line_color, button_text_color, input_background, panel_background]
      properties:
        background_color: { type: string, maxLength: 128 }
        background_image: { type: [string, 'null'], maxLength: 2048 }
        background_overlay: { type: string, maxLength: 2048 }
        border_line_color: { type: string, maxLength: 128 }
        button_text_color: { type: string, maxLength: 128 }
        input_background: { type: string, maxLength: 256 }
        panel_background: { type: string, maxLength: 256 }
    PublicWelcome:
      type: object
      additionalProperties: false
      required: [pages]
      properties:
        pages:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/PublicWelcomePage'
    PublicWelcomePage:
      type: object
      additionalProperties: false
      required: [backgrounds, body, buttons, eyebrow, title]
      properties:
        backgrounds:
          $ref: '#/components/schemas/PublicAppearanceImages'
        body: { type: string, maxLength: 1200 }
        buttons:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/PublicWelcomeButton'
        eyebrow: { type: string, maxLength: 120 }
        title: { type: string, maxLength: 160 }
    PublicWelcomeButton:
      type: object
      additionalProperties: false
      required: [target, text]
      properties:
        target: { type: string, maxLength: 2048 }
        text: { type: string, maxLength: 80 }
    PublicAppearanceImages:
      type: object
      additionalProperties: false
      required: [dark, light]
      properties:
        dark: { type: [string, 'null'], maxLength: 2048 }
        light: { type: [string, 'null'], maxLength: 2048 }
    PublicPaletteModes:
      type: object
      additionalProperties: false
      required: [dark, light]
      properties:
        dark:
          $ref: '#/components/schemas/PublicPalette'
        light:
          $ref: '#/components/schemas/PublicPalette'
    PublicPalette:
      type: object
      additionalProperties: false
      required: [accent_text, accent_text_opacity, body_text, body_text_opacity, control_border, control_border_opacity, control_text, control_text_opacity, heading_text, heading_text_opacity, muted_text, muted_text_opacity, welcome_overlay, welcome_overlay_opacity]
      properties:
        accent_text: { type: string, maxLength: 128 }
        accent_text_opacity: { type: integer, minimum: 0, maximum: 100 }
        body_text: { type: string, maxLength: 128 }
        body_text_opacity: { type: integer, minimum: 0, maximum: 100 }
        control_border: { type: string, maxLength: 128 }
        control_border_opacity: { type: integer, minimum: 0, maximum: 100 }
        control_text: { type: string, maxLength: 128 }
        control_text_opacity: { type: integer, minimum: 0, maximum: 100 }
        heading_text: { type: string, maxLength: 128 }
        heading_text_opacity: { type: integer, minimum: 0, maximum: 100 }
        muted_text: { type: string, maxLength: 128 }
        muted_text_opacity: { type: integer, minimum: 0, maximum: 100 }
        welcome_overlay: { type: string, maxLength: 128 }
        welcome_overlay_opacity: { type: integer, minimum: 0, maximum: 100 }
    PublicSourceLink:
      type: object
      additionalProperties: false
      required: [label, url]
      properties:
        label:
          type: string
          maxLength: 80
        url:
          type: string
          format: uri
          description: An HTTP(S) link opened outside the application.
    PublicSourceLinks:
      type: object
      additionalProperties: false
      required: [origin, modified_sources]
      properties:
        origin:
          $ref: '#/components/schemas/PublicSourceLink'
        modified_sources:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/PublicSourceLink'
    PublicMapAsset:
      type: object
      additionalProperties: false
      required: [slug, title, description, x, y, z, image_url, text, width, opacity, locked, visual_config, interaction_config, sound_config, interaction_mode]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        title:
          type: string
        description:
          type: string
        x:
          type: number
          minimum: 0
          maximum: 100
        y:
          type: number
          minimum: 0
          maximum: 100
        z:
          type: integer
        image_url:
          type: [string, 'null']
          format: uri
        text:
          type: [string, 'null']
        width:
          type: number
          exclusiveMinimum: 0
        opacity:
          type: number
          minimum: 0
          maximum: 1
        locked:
          type: boolean
        visual_config:
          type: object
          additionalProperties: true
        interaction_config:
          type: object
          additionalProperties: true
        sound_config:
          type: object
          additionalProperties: true
        interaction_mode:
          type: string
          enum: [focusable, decorative, hide_on_hover, toggle]
    PublicNode:
      type: object
      additionalProperties: false
      required: [asset_slug, slug, title, description, q, r, state, visual_config]
      properties:
        asset_slug:
          type: [string, 'null']
          pattern: '^[a-z0-9-]+$'
          description: The published map-asset slug that presents this node, when it has one.
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        title:
          type: string
        description:
          type: string
        q:
          type: integer
        r:
          type: integer
        state:
          type: string
          enum: [available, locked, hidden]
        visual_config:
          type: object
          additionalProperties: true
    PublicMap:
      type: object
      additionalProperties: false
      required: [slug, title, description, background_config, grid_config, map_assets_locked, assets, nodes]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        title:
          type: string
        description:
          type: string
        background_config:
          type: object
          additionalProperties: true
        grid_config:
          type: object
          additionalProperties: true
        map_assets_locked:
          type: boolean
        assets:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PublicMapAsset'
        nodes:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PublicNode'
    PublicWorld:
      type: object
      additionalProperties: false
      required: [slug, title, description, theme_config, maps]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        title:
          type: string
        description:
          type: string
        theme_config:
          type: object
          additionalProperties: true
        maps:
          type: array
          maxItems: 24
          items:
            $ref: '#/components/schemas/PublicMap'
    LearnerActivityProgress:
      type: object
      additionalProperties: false
      required: [node_slug, activity_slug, status, completed_at]
      properties:
        node_slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        activity_slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        status:
          type: string
          enum: [reached, completed]
        completed_at:
          type: [string, 'null']
          format: date-time
    LearnerBookmarkResult:
      type: object
      additionalProperties: false
      required: [bookmarked, bookmarked_nodes]
      properties:
        bookmarked: { type: boolean }
        bookmarked_nodes:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/LearnerBookmark'
    LearnerBookmark:
      type: object
      additionalProperties: false
      required: [map_slug, node_slug]
      properties:
        map_slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        node_slug:
          type: string
          pattern: '^[a-z0-9-]+$'
    LearnerItem:
      type: object
      additionalProperties: false
      required: [config, description, image_dark, image_light, quantity, slug, title]
      properties:
        config:
          type: object
          additionalProperties: true
        description:
          type: [string, 'null']
        image_dark:
          type: [string, 'null']
        image_light:
          type: [string, 'null']
        quantity:
          type: integer
          minimum: 1
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        title:
          type: string
    LearnerTool:
      type: object
      additionalProperties: false
