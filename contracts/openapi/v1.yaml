openapi: 3.1.1
info:
  title: Wicked Learning API
  version: 1.0.0-draft
  description: |
    The versioned contract between the React client and Rust/Axum API.
    The initial read-only public-information pages are available to prove the full React,
    contract, Axum and PostgreSQL path. User-facing writes and AI operations
    require a separately reviewed vertical slice.
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Report whether the API process is running.
      responses:
        '200':
          description: The API process is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report whether required databases are reachable.
      responses:
        '200':
          description: The API and both databases are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /session:
    get:
      operationId: getSessionStatus
      summary: Read the safe authentication state for the current browser session.
      responses:
        '200':
          description: Current session state without credential material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
  /session/two-factor:
    post:
      operationId: completeTwoFactorLogin
      summary: Complete a pending Rust-owned two-factor login challenge.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorChallengeRequest' }
      responses:
        '200':
          description: The browser is now authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStatus' }
        '401': { description: The challenge is missing, expired, invalid, or already used. }
        '403': { description: A valid same-origin CSRF request is required. }
        '429': { description: Too many challenge attempts were made. }
        '503': { description: The identity database is unavailable. }
  /session/passkey/options:
    post:
      operationId: startPasskeyLogin
      summary: Start an anonymous discoverable-passkey sign-in ceremony.
      description: The server stores the short-lived WebAuthn ceremony in the browser's server-side session. The browser must pass the returned public-key options to its maintained WebAuthn client unchanged.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: Browser WebAuthn request options without a credential allow-list, enabling source-equivalent discoverable passkeys.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyOptions' }
        '403': { description: A valid same-origin CSRF request is required, or this browser is already signed in. }
        '429': { description: Too many passkey ceremony attempts were made. }
        '503': { description: The identity database or passkey service is unavailable. }
  /session/passkey:
    post:
      operationId: completePasskeyLogin
      summary: Complete an anonymous discoverable-passkey sign-in ceremony.
      description: The response is verified server-side against the stored short-lived ceremony and the identity-owned public credential; no credential secret enters the API or application database.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebAuthnCredential' }
      responses:
        '200':
          description: The browser is signed in with its opaque server-side session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStatus' }
        '401': { description: The passkey assertion, account state or ceremony is invalid. }
        '403': { description: A valid same-origin CSRF request is required, or this browser is already signed in. }
        '429': { description: Too many passkey ceremony attempts were made. }
        '503': { description: The identity database or passkey service is unavailable. }
  /registration:
    post:
      operationId: registerIdentity
      summary: Create and sign in a fresh invitation-authorized identity.
      description: The server validates and consumes a one-use invitation, creates credential and identity-profile records in the identity database, provisions an application principal through a compensating workflow, then establishes a server-side session.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityRegistrationRequest'
      responses:
        '200':
          description: The new identity is signed in with an opaque server-side session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '403': { description: A valid same-origin CSRF request is required. }
        '422': { description: The registration details, address or invitation cannot create an account. }
        '429': { description: Too many registration attempts were made. }
        '503': { description: An identity or application dependency is unavailable. }
  /registration-tokens:
    post:
      operationId: createRegistrationToken
      summary: Create a one-use registration token with roles the issuer may assign.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRegistrationTokenRequest' }
      responses:
        '200':
          description: The opaque token, returned once only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateRegistrationTokenResponse' }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '400': { description: The expiry, note or requested roles are invalid or exceed the issuer's hierarchy. }
        '503': { description: The application or identity database is unavailable. }
    
  /access-links/{token}/redeem:
    post:
      operationId: redeemAccessLink
      summary: Redeem an opaque tool or item grant as the authenticated learner.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '204': { description: The grant was applied and an audit redemption was recorded. }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The link is unknown, disabled, expired, already consumed, or already used by this learner. }
        '503': { description: The application database is unavailable. }
  /access-links/{token}/temporary-login:
    post:
      operationId: redeemTemporaryAccessLink
      summary: Create and sign in a temporary learner for an opaque access link.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: A fresh temporary learner was created and signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStatus' }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The link is unknown, disabled, expired, consumed, or not a temporary-login link. }
        '503': { description: An identity or application dependency is unavailable. }
  /access-links/{token}:
    get:
      operationId: getAccessLinkPreview
      summary: Read the non-sensitive purpose and note for an active access-link grant.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: A currently usable link preview, without the grant payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessLinkPreview' }
        '404': { description: The link is unknown, disabled, expired, or consumed. }
        '503': { description: The application database is unavailable. }
  /me:
    get:
      operationId: getCurrentUser
      summary: Read the current authenticated subject and application roles.
      responses:
        '200':
          description: The opaque identity subject and roles currently granted by the application database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The identity has no application principal or role assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /admin/platform-feedback:
    get:
      operationId: getAdminPlatformFeedback
      summary: Read a bounded page of deliberately shared platform feedback for an authorized reviewer.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
      responses:
        '200':
          description: Unreviewed feedback first, then reviewed feedback, as in the source review queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlatformFeedbackPage' }
        '401': { description: Authentication is required. }
        '404': { description: The review queue is unavailable to this principal. }
        '503': { description: The application or identity database is unavailable. }
  /admin/platform-feedback/{feedback_id}/review:
    patch:
      operationId: markAdminPlatformFeedbackReviewed
      summary: Mark one deliberately shared platform-feedback message reviewed.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - name: feedback_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: The feedback message was marked reviewed. }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The feedback message is unknown or review is unavailable to this principal. }
        '503': { description: The application database is unavailable. }
  /admin/journal-feedback/policy:
    get:
      operationId: getAdminJournalFeedbackPolicy
      summary: Read the source-defined global opt-in policy for private journal review requests.
      responses:
        '200':
          description: The current journal-review policy.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminJournalFeedbackPolicy' } } }
        '401': { description: Authentication is required. }
        '404': { description: Journal policy management is unavailable to this principal. }
        '503': { description: The application database is unavailable. }
    patch:
      operationId: updateAdminJournalFeedbackPolicy
      summary: Enable or disable future learner requests for one-time private journal review.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAdminJournalFeedbackPolicyRequest' } } }
      responses:
        '200':
          description: The saved policy.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminJournalFeedbackPolicy' } } }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: Journal policy management is unavailable to this principal. }
        '503': { description: The application database is unavailable. }
  /admin/journal-feedback:
    get:
      operationId: getAdminJournalFeedback
      summary: Read a bounded staff queue of journal pages learners explicitly shared for feedback.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
      responses:
        '200':
          description: Requested and completed journal reviews, most recently requested first.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminJournalFeedbackPage' } } }
        '401': { description: Authentication is required. }
        '404': { description: The private journal review queue is unavailable to this principal. }
        '503': { description: The application or identity database is unavailable. }
  /admin/journal-feedback/{request_id}/respond:
    post:
      operationId: respondToAdminJournalFeedback
      summary: Attach one informational staff response to an explicitly shared journal page.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RespondToAdminJournalFeedbackRequest' } } }
      responses:
        '204': { description: The response was attached to the shared journal page. }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The journal request is unknown or review is unavailable to this principal. }
        '422': { description: The request was already responded to or the response is invalid. }
        '503': { description: The application database is unavailable. }
  /platform-feedback:
    post:
      operationId: submitPlatformFeedback
      summary: Deliberately share bounded platform feedback with the platform team.
      description: This is distinct from private journal, activity and competence data.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitPlatformFeedbackRequest' }
      responses:
        '204': { description: The feedback was recorded for authorized platform review. }
        '400': { description: The category or bounded feedback message is invalid. }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '503': { description: The application database is unavailable. }
  /account/password:
    patch:
      operationId: updateAccountPassword
      summary: Replace the current authenticated subject's Rust-owned password.
      description: The current password is required. Successful replacement keeps this browser signed in and invalidates sessions authenticated with the prior password verifier.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountPasswordRequest'
      responses:
        '200':
          description: The refreshed authenticated session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '422': { description: The current password, replacement password, or confirmation was rejected. }
        '503': { description: The identity database is unavailable. }
  /account/password/confirmation:
    get:
      operationId: getPasswordConfirmationStatus
      summary: Read whether this authenticated browser recently confirmed its password.
      responses:
        '200':
          description: The confirmation status is scoped to the server-side browser session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordConfirmationStatus' }
        '503': { description: The identity session store is unavailable. }
    post:
      operationId: confirmAccountPassword
      summary: Confirm the current authenticated subject's password for sensitive actions.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmAccountPasswordRequest' }
      responses:
        '200':
          description: The password-confirmation window is open for this server-side browser session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordConfirmationStatus' }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '422': { description: The password could not be confirmed. }
        '503': { description: The identity database or session store is unavailable. }
  /account/passkeys/confirmation/options:
    post:
      operationId: startPasskeyConfirmation
      summary: Start a current-account passkey confirmation ceremony.
      description: A successful completion opens the existing recent-confirmation window for this server-side browser session.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: Browser WebAuthn assertion options limited to the authenticated owner's passkeys.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyOptions' }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The authenticated account has no passkeys. }
        '429': { description: Too many passkey ceremony attempts were made. }
        '503': { description: The identity database or passkey service is unavailable. }
  /account/passkeys/confirmation:
    post:
      operationId: completePasskeyConfirmation
      summary: Confirm the current account with an enrolled passkey.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebAuthnCredential' }
      responses:
        '200':
          description: The password-confirmation window is open for this server-side browser session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordConfirmationStatus' }
        '400': { description: The assertion or short-lived ceremony is invalid. }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '429': { description: Too many passkey ceremony attempts were made. }
        '503': { description: The identity database or passkey service is unavailable. }
  /account/passkeys/options:
    post:
      operationId: startPasskeyRegistration
      summary: Start a source-equivalent resident-passkey registration ceremony.
      description: Requires the authenticated owner's existing recent-confirmation window. The server excludes already-enrolled credentials and retains ceremony state only in the server-side session for sixty seconds.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: Browser WebAuthn registration options requesting a discoverable credential and user verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyOptions' }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request and recent account confirmation are required. }
        '429': { description: Too many passkey ceremony attempts were made. }
        '503': { description: The identity database or passkey service is unavailable. }
  /account/passkeys:
    get:
      operationId: listAccountPasskeys
      summary: List the authenticated owner's passkey labels and non-secret usage timestamps.
      responses:
        '200':
          description: Source-shaped account passkey summaries; public credentials and WebAuthn counters are never returned.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PasskeySummary' }
        '401': { description: Authentication is required. }
        '403': { description: Recent account confirmation is required. }
        '503': { description: The identity database is unavailable. }
    post:
      operationId: registerAccountPasskey
      summary: Complete a passkey registration ceremony and save an identity-owned public credential.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterPasskeyRequest' }
      responses:
        '200':
          description: The newly saved non-secret summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeySummary' }
        '400': { description: The label, credential or short-lived registration ceremony is invalid. }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request and recent account confirmation are required. }
        '429': { description: Too many passkey ceremony attempts were made. }
        '503': { description: The identity database or application audit delivery dependency is unavailable. }
  /account/passkeys/{passkey_id}:
    delete:
      operationId: deleteAccountPasskey
      summary: Remove one passkey owned by the recently confirmed current account.
      parameters:
        - name: passkey_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '204': { description: The public credential was deleted and a non-secret access-history event was queued. }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request and recent account confirmation are required. }
        '404': { description: The passkey does not belong to the authenticated account. }
        '429': { description: Too many passkey ceremony attempts were made. }
        '503': { description: The identity database or application audit delivery dependency is unavailable. }
  /account/two-factor/setup:
    post:
      operationId: startAccountTwoFactorSetup
      summary: Start a pending authenticator-app enrollment for the current subject.
      description: The response contains the one-time provisioning secret for the authenticated browser only and is explicitly non-cacheable. It stores an encrypted pending factor in the identity database but does not enable two-factor login; confirmation, recovery codes and the login challenge are separate contract slices.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: A fresh pending enrollment secret and standard otpauth provisioning URL. The response must not be persisted by a client.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingTwoFactorSetup'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request and recent password confirmation are required. }
        '429': { description: Too many two-factor setup attempts were made. }
        '503': { description: The identity database is unavailable. }
  /account/two-factor:
    get:
      operationId: getAccountTwoFactorStatus
      summary: Read whether the authenticated subject has a confirmed authenticator factor.
      responses:
        '200':
          description: No factor secret or recovery code is exposed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorStatus' }
        '401': { description: Authentication is required. }
        '503': { description: The identity database is unavailable. }
    delete:
      operationId: disableAccountTwoFactor
      summary: Disable the authenticated subject's confirmed authenticator factor.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The factor and all recovery-code credentials were removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorStatus' }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request and recent password confirmation are required. }
        '503': { description: The identity database is unavailable. }
  /account/two-factor/recovery-codes:
    get:
      operationId: getAccountTwoFactorRecoveryCodes
      summary: Read the authenticated owner's remaining recovery codes.
      responses:
        '200':
          description: Remaining codes are returned only to the recently confirmed owner and must not be cached.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '401': { description: Authentication is required. }
        '403': { description: Recent password confirmation is required. }
        '503': { description: The identity database is unavailable. }
    post:
      operationId: regenerateAccountTwoFactorRecoveryCodes
      summary: Replace the authenticated owner's recovery codes with a fresh set.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: Fresh codes replace every prior recovery code and must not be cached.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request and recent password confirmation are required. }
        '404': { description: No confirmed authenticator factor exists. }
        '429': { description: Too many recovery-code replacement attempts were made. }
        '503': { description: The identity database is unavailable. }
  /account/two-factor/confirm:
    post:
      operationId: confirmAccountTwoFactorSetup
      summary: Confirm a pending authenticator enrollment and return new recovery codes once.
      description: The submitted six-digit authenticator code must match a pending enrollment created within 15 minutes. On success the pending encrypted secret replaces any prior confirmed factor and the browser receives ten fresh recovery codes. Each code has an Argon2id verifier for login and an AES-GCM encrypted display copy in the identity database, so a recently confirmed owner can use the source recovery-code manager.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmTwoFactorSetupRequest'
      responses:
        '200':
          description: Fresh one-use recovery codes. The response must not be persisted by a client.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request and recent password confirmation are required. }
        '422': { description: The code is malformed, invalid, expired, or no pending enrollment exists. }
        '429': { description: Too many two-factor confirmation attempts were made. }
        '503': { description: The identity database is unavailable. }
  /account/profile:
    get:
      operationId: getAccountProfile
      summary: Read the current subject's source-shaped profile fields.
      responses:
        '200':
          description: Identity-owned name/email and application-owned public username for the current subject only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        '401': { description: Authentication is required. }
        '403': { description: The identity has no application principal. }
        '503': { description: An identity or application database is unavailable. }
    patch:
      operationId: updateAccountProfile
      summary: Update the current subject's identity and public profile fields.
      description: The update is CSRF protected and never exposes another person's identity profile. The application compensates a failed cross-database update rather than duplicating identity data.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountProfileRequest'
      responses:
        '200':
          description: The saved current-subject profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '422': { description: The name, email address, public username, or selected image was rejected. }
        '503': { description: An identity or application database is unavailable. }
    delete:
      operationId: deleteAccountProfile
      summary: Permanently delete the current account and its resources.
      description: Mirrors the source profile-deletion form. The current password is required in this same CSRF-protected destructive request; the server then deprovisions identity and application data through the resumable deletion workflow.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204': { description: "The account, application principal, and related data were deleted and the browser session was ended." }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '422': { description: The supplied current password was rejected. }
        '503': { description: An identity or application database is unavailable. }
  /account/profile/image:
    post:
      operationId: uploadAccountProfileImage
      summary: Stage a source-supported profile image for the current subject.
      description: The upload is private to its owner until its returned profile_image_id is saved with PATCH /account/profile. The server accepts GIF, JPEG, PNG, SVG and WebP only after inspecting its bytes; uploaded SVG is served with a restrictive content-security policy.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: GIF, JPEG, PNG, SVG or WebP image, up to 5 MiB.
      responses:
        '200':
          description: A private staged image which may be selected by the current subject's next profile save.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileImageUpload'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '413': { description: The upload exceeds the 5 MiB profile-image limit. }
        '422': { description: The upload is empty, has an unsupported byte signature, or has an invalid multipart shape. }
        '503': { description: The application database or mounted media store is unavailable. }
  /profile-images/{profile_image_id}:
    get:
      operationId: getProfileImage
      summary: Read an authorized profile image.
      description: A pending image is visible only to its owner. A saved image is visible to signed-in users for use in shared learning spaces.
      parameters:
        - name: profile_image_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Image bytes with an inspected image content type and anti-sniffing headers.
          content:
            image/gif: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { description: Authentication is required. }
        '404': { description: The image is unavailable to this subject. }
        '503': { description: The application database or mounted media store is unavailable. }
  /learner/world:
    get:
      operationId: getLearnerWorld
      summary: Read the signed-in learner's authorized World snapshot and bounded progress summaries.
      responses:
        '200':
          description: Visible published maps plus only this learner's bookmarks and progress summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerWorldSnapshot'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The identity has no application principal or role assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No World map is visible to this learner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /admin/world-builder:
    get:
      operationId: getAdminWorldBuilderGraph
      summary: Read the signed-in author's source-shaped, editable World Builder graph.
      description: The server authorizes opening World Builder by any of the four source World Builder read permissions, then returns only maps editable through the source all/own/assigned/group scope. It includes draft map and node content; it is not a learner World endpoint and does not authorize mutations.
      responses:
        '200':
          description: The current authoring World and only the maps within the principal's edit scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWorldGraph'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The identity has no application principal or role assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The World Builder is unavailable to this principal or no current authoring World exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /admin/world-builder/maps:
    post:
      operationId: createAdminWorldBuilderMap
      summary: Create a source-shaped draft World Builder map.
      description: Requires the source world-map update permission. The server resolves the current authoring World, assigns the creator and selects a collision-safe generated slug when one is omitted.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAdminWorldMapRequest' }
      responses:
        '201':
          description: The draft map was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateAdminWorldMapResponse' }
        '400': { description: The source map form is invalid. }
        '401': { description: Authentication is required. }
        '403': { description: The CSRF or origin check failed. }
        '404': { description: The principal cannot create a map or no authoring World exists. }
        '503': { description: The application database is unavailable. }
  /admin/world-builder/maps/{map_id}:
    get:
      operationId: getAdminWorldBuilderMap
      summary: Read one source-shaped, editable World Builder map configuration.
      description: Unlike the graph overview, this source workspace requires world-map update permission and its map-specific all/own/assigned/direct-editor scope. It includes draft map assets and configuration but permits no mutation.
      parameters:
        - name: map_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The requested scoped map configuration and its current delete eligibility.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditableMap'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The identity has no application principal or role assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The map is unknown or unavailable through the source editor scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: deleteAdminWorldBuilderMap
      summary: Delete a source-scoped World Builder map and its dependent state.
      description: Requires the source world-map delete permission and its all, own or assigned map scope. Database cascades remove map-owned tiles, activities, portal links and learner state atomically.
      parameters:
        - name: map_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '204': { description: The map and its dependent state were deleted. }
        '401': { description: Authentication is required. }
        '403': { description: The CSRF or origin check failed. }
        '404': { description: The map is unknown or unavailable through the source delete scope. }
        '503': { description: The application database is unavailable. }
  /admin/world-builder/maps/{map_id}/details:
    patch:
      operationId: updateAdminWorldBuilderMapDetails
      summary: Update the source Map Details form for one scoped World Builder map.
      description: Requires the source world-map update permission and its map-specific all, own, assigned or direct-editor scope. The complete form uses the selected map timestamp to reject stale saves before they overwrite a newer authoring change.
      parameters:
        - name: map_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminWorldMapDetailsRequest' }
      responses:
        '200':
          description: The source Map Details form was saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateAdminWorldMapDetailsResponse' }
        '400': { description: The complete source form, learning topic or updated timestamp is invalid. }
        '401': { description: Authentication is required. }
        '403': { description: The CSRF or origin check failed. }
        '404': { description: The map is unknown or unavailable through the source editor scope. }
        '409': { description: The map changed after this browser copy was loaded. }
        '503': { description: The application database is unavailable. }
  /admin/world-builder/maps/{map_id}/access:
    patch:
      operationId: updateAdminWorldBuilderMapAccess
      summary: Replace the source viewer groups for one scoped World Builder map.
      description: Requires the distinct source map-access update permission and its all, own or assigned map scope. It changes learner visibility only; map editor assignments remain a separate command.
      parameters:
        - name: map_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminWorldMapAccessRequest' }
      responses:
        '204': { description: The map viewer groups were replaced. }
        '400': { description: The source access form contains no groups or an unknown role. }
        '401': { description: Authentication is required. }
        '403': { description: The CSRF or origin check failed. }
        '404': { description: The map is unknown or unavailable through the source map-access scope. }
        '503': { description: The application database is unavailable. }
  /admin/world-builder/maps/{map_id}/editing-groups:
    patch:
      operationId: updateAdminWorldBuilderMapEditingGroups
      summary: Replace the source map editor groups for one scoped World Builder map.
      description: Requires the distinct source map-access update permission and its all, own or assigned map scope. Each selected group must also be manageable through the caller's source group-management scope. It changes authoring assignments only; learner visibility remains a separate command.
      parameters:
        - name: map_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminWorldMapEditingGroupsRequest' }
      responses:
        '204': { description: The map editor groups were replaced. }
        '400': { description: The selected group is unavailable or outside the caller's group-management scope. }
        '401': { description: Authentication is required. }
        '403': { description: The CSRF or origin check failed. }
        '404': { description: The map is unknown or unavailable through the source map-access scope. }
        '503': { description: The application database is unavailable. }
  /admin/world-builder/maps/{map_id}/assets:
    post:
      operationId: createAdminWorldBuilderMapAsset
      summary: Add a source-shaped MapAsset and its activity-editor compatibility node.
      description: Requires the source world-map update permission and the scoped map editor policy. The server creates the linked Node and draft route atomically, and records reusable visual references from its saved surface configuration.
      parameters:
        - name: map_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertAdminWorldMapAssetRequest' }
      responses:
        '201':
          description: The MapAsset and linked compatibility node were created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateAdminWorldMapAssetResponse' }
        '400': { description: The source MapAsset surface configuration is invalid. }
        '401': { description: Authentication is required. }
        '403': { description: The CSRF or origin check failed. }
        '404': { description: The map is unknown or unavailable through the source editor scope. }
        '503': { description: The application database is unavailable. }
  /admin/world-builder/assets/{asset_id}:
    patch:
      operationId: updateAdminWorldBuilderMapAsset
      summary: Save one source-shaped MapAsset surface configuration.
      description: Requires the source world-map update permission and the MapAsset's scoped map editor policy. Reusable media links in the image or JSON configuration are synchronized atomically with the authored surface.
      parameters:
        - name: asset_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertAdminWorldMapAssetRequest' }
      responses:
        '204': { description: The MapAsset surface was saved. }
        '400': { description: The source MapAsset surface configuration is invalid. }
        '401': { description: Authentication is required. }
        '403': { description: The CSRF or origin check failed. }
        '404': { description: The MapAsset is unknown or unavailable through the source editor scope. }
        '503': { description: The application database is unavailable. }
    delete:
      operationId: deleteAdminWorldBuilderMapAsset
      summary: Delete one source-scoped MapAsset.
      description: Requires the source world-map delete permission and scoped map delete policy. Its linked route data cascades; the compatibility Node remains as an unattached legacy tile, matching the source asset-only deletion boundary.
      parameters:
        - name: asset_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '204': { description: The MapAsset was deleted. }
        '401': { description: Authentication is required. }
        '403': { description: The CSRF or origin check failed. }
        '404': { description: The MapAsset is unknown or unavailable through the source delete scope. }
        '503': { description: The application database is unavailable. }
  /admin/world-builder/nodes/{node_id}:
    get:
      operationId: getAdminWorldBuilderNode
      summary: Read one source-shaped, editable World Builder node activity graph.
      description: This authoring-only read requires world-activity update permission and the source all/own/assigned/direct-editor map scope. It supplies the existing React node editor's graph and support data but authorizes no mutation.
      parameters:
        - name: node_id
          in: path
