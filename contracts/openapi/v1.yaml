openapi: 3.1.1
info:
  title: Wicked Learning API
  version: 1.0.0-draft
  description: |
    The versioned contract between the React client and Rust/Axum API.
    The initial read-only public-information pages are available to prove the full React,
    contract, Axum and PostgreSQL path. User-facing writes and AI operations
    require a separately reviewed vertical slice.
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Report whether the API process is running.
      responses:
        '200':
          description: The API process is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report whether required databases are reachable.
      responses:
        '200':
          description: The API and both databases are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /session:
    get:
      operationId: getSessionStatus
      summary: Read the safe authentication state for the current browser session.
      responses:
        '200':
          description: Current session state without credential material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
  /registration:
    post:
      operationId: registerIdentity
      summary: Create and sign in a fresh invitation-authorized identity.
      description: The server validates and consumes a one-use invitation, creates credential and identity-profile records in the identity database, provisions an application principal through a compensating workflow, then establishes a server-side session.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityRegistrationRequest'
      responses:
        '200':
          description: The new identity is signed in with an opaque server-side session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '403': { description: A valid same-origin CSRF request is required. }
        '422': { description: The registration details, address or invitation cannot create an account. }
        '429': { description: Too many registration attempts were made. }
        '503': { description: An identity or application dependency is unavailable. }
  /registration-tokens:
    post:
      operationId: createRegistrationToken
      summary: Create a one-use registration token with roles the issuer may assign.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRegistrationTokenRequest' }
      responses:
        '200':
          description: The opaque token, returned once only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateRegistrationTokenResponse' }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '400': { description: The expiry, note or requested roles are invalid or exceed the issuer's hierarchy. }
        '503': { description: The application or identity database is unavailable. }
    
  /access-links/{token}/redeem:
    post:
      operationId: redeemAccessLink
      summary: Redeem an opaque tool or item grant as the authenticated learner.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '204': { description: The grant was applied and an audit redemption was recorded. }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The link is unknown, disabled, expired, already consumed, or already used by this learner. }
        '503': { description: The application database is unavailable. }
  /access-links/{token}/temporary-login:
    post:
      operationId: redeemTemporaryAccessLink
      summary: Create and sign in a temporary learner for an opaque access link.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: A fresh temporary learner was created and signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStatus' }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The link is unknown, disabled, expired, consumed, or not a temporary-login link. }
        '503': { description: An identity or application dependency is unavailable. }
  /access-links/{token}:
    get:
      operationId: getAccessLinkPreview
      summary: Read the non-sensitive purpose and note for an active access-link grant.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: A currently usable link preview, without the grant payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessLinkPreview' }
        '404': { description: The link is unknown, disabled, expired, or consumed. }
        '503': { description: The application database is unavailable. }
  /me:
    get:
      operationId: getCurrentUser
      summary: Read the current authenticated subject and application roles.
      responses:
        '200':
          description: The opaque identity subject and roles currently granted by the application database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The identity has no application principal or role assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /admin/platform-feedback:
    get:
      operationId: getAdminPlatformFeedback
      summary: Read a bounded page of deliberately shared platform feedback for an authorized reviewer.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
      responses:
        '200':
          description: Unreviewed feedback first, then reviewed feedback, as in the source review queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlatformFeedbackPage' }
        '401': { description: Authentication is required. }
        '404': { description: The review queue is unavailable to this principal. }
        '503': { description: The application or identity database is unavailable. }
  /admin/platform-feedback/{feedback_id}/review:
    patch:
      operationId: markAdminPlatformFeedbackReviewed
      summary: Mark one deliberately shared platform-feedback message reviewed.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - name: feedback_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: The feedback message was marked reviewed. }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The feedback message is unknown or review is unavailable to this principal. }
        '503': { description: The application database is unavailable. }
  /admin/journal-feedback/policy:
    get:
      operationId: getAdminJournalFeedbackPolicy
      summary: Read the source-defined global opt-in policy for private journal review requests.
      responses:
        '200':
          description: The current journal-review policy.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminJournalFeedbackPolicy' } } }
        '401': { description: Authentication is required. }
        '404': { description: Journal policy management is unavailable to this principal. }
        '503': { description: The application database is unavailable. }
    patch:
      operationId: updateAdminJournalFeedbackPolicy
      summary: Enable or disable future learner requests for one-time private journal review.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAdminJournalFeedbackPolicyRequest' } } }
      responses:
        '200':
          description: The saved policy.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminJournalFeedbackPolicy' } } }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: Journal policy management is unavailable to this principal. }
        '503': { description: The application database is unavailable. }
  /admin/journal-feedback:
    get:
      operationId: getAdminJournalFeedback
      summary: Read a bounded staff queue of journal pages learners explicitly shared for feedback.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
      responses:
        '200':
          description: Requested and completed journal reviews, most recently requested first.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminJournalFeedbackPage' } } }
        '401': { description: Authentication is required. }
        '404': { description: The private journal review queue is unavailable to this principal. }
        '503': { description: The application or identity database is unavailable. }
  /admin/journal-feedback/{request_id}/respond:
    post:
      operationId: respondToAdminJournalFeedback
      summary: Attach one informational staff response to an explicitly shared journal page.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RespondToAdminJournalFeedbackRequest' } } }
      responses:
        '204': { description: The response was attached to the shared journal page. }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The journal request is unknown or review is unavailable to this principal. }
        '422': { description: The request was already responded to or the response is invalid. }
        '503': { description: The application database is unavailable. }
  /platform-feedback:
    post:
      operationId: submitPlatformFeedback
      summary: Deliberately share bounded platform feedback with the platform team.
      description: This is distinct from private journal, activity and competence data.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitPlatformFeedbackRequest' }
      responses:
        '204': { description: The feedback was recorded for authorized platform review. }
        '400': { description: The category or bounded feedback message is invalid. }
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '503': { description: The application database is unavailable. }
  /account/password:
    patch:
      operationId: updateAccountPassword
      summary: Replace the current authenticated subject's Rust-owned password.
      description: The current password is required. Successful replacement keeps this browser signed in and invalidates sessions authenticated with the prior password verifier.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountPasswordRequest'
      responses:
        '200':
          description: The refreshed authenticated session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '422': { description: The current password, replacement password, or confirmation was rejected. }
        '503': { description: The identity database is unavailable. }
  /account/profile:
    get:
      operationId: getAccountProfile
      summary: Read the current subject's source-shaped profile fields.
      responses:
        '200':
          description: Identity-owned name/email and application-owned public username for the current subject only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        '401': { description: Authentication is required. }
        '403': { description: The identity has no application principal. }
        '503': { description: An identity or application database is unavailable. }
    patch:
      operationId: updateAccountProfile
      summary: Update the current subject's identity and public profile fields.
      description: The update is CSRF protected and never exposes another person's identity profile. The application compensates a failed cross-database update rather than duplicating identity data.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountProfileRequest'
      responses:
        '200':
          description: The saved current-subject profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '422': { description: The name, email address, public username, or selected image was rejected. }
        '503': { description: An identity or application database is unavailable. }
  /account/profile/image:
    post:
      operationId: uploadAccountProfileImage
      summary: Stage a source-supported profile image for the current subject.
      description: The upload is private to its owner until its returned profile_image_id is saved with PATCH /account/profile. The server accepts GIF, JPEG, PNG, SVG and WebP only after inspecting its bytes; uploaded SVG is served with a restrictive content-security policy.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: GIF, JPEG, PNG, SVG or WebP image, up to 5 MiB.
      responses:
        '200':
          description: A private staged image which may be selected by the current subject's next profile save.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileImageUpload'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '413': { description: The upload exceeds the 5 MiB profile-image limit. }
        '422': { description: The upload is empty, has an unsupported byte signature, or has an invalid multipart shape. }
        '503': { description: The application database or mounted media store is unavailable. }
  /profile-images/{profile_image_id}:
    get:
      operationId: getProfileImage
      summary: Read an authorized profile image.
      description: A pending image is visible only to its owner. A saved image is visible to signed-in users for use in shared learning spaces.
      parameters:
        - name: profile_image_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Image bytes with an inspected image content type and anti-sniffing headers.
          content:
            image/gif: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { description: Authentication is required. }
        '404': { description: The image is unavailable to this subject. }
        '503': { description: The application database or mounted media store is unavailable. }
  /learner/world:
    get:
      operationId: getLearnerWorld
      summary: Read the signed-in learner's authorized World snapshot and bounded progress summaries.
      responses:
        '200':
          description: Visible published maps plus only this learner's bookmarks and progress summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerWorldSnapshot'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The identity has no application principal or role assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No World map is visible to this learner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /learner/maps/{map_slug}/nodes/{node_slug}/bookmark:
    post:
      operationId: createLearnerNodeBookmark
      summary: Bookmark an accessible learner map node.
      parameters:
        - $ref: '#/components/parameters/MapSlug'
        - $ref: '#/components/parameters/NodeSlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The accessible bookmark set after the idempotent save.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerBookmarkResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The map node is unknown or not accessible to this learner. }
        '503': { description: The application database is unavailable. }
    delete:
      operationId: deleteLearnerNodeBookmark
      summary: Remove the current learner's bookmark for an accessible map node.
      parameters:
        - $ref: '#/components/parameters/MapSlug'
        - $ref: '#/components/parameters/NodeSlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: The accessible bookmark set after the idempotent removal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerBookmarkResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The map node is unknown or not accessible to this learner. }
        '503': { description: The application database is unavailable. }
  /learner/maps/{map_slug}/nodes/{node_slug}/use-tool:
    post:
      operationId: useLearnerToolOnNode
      summary: Use one of the signed-in learner's owned tools on an accessible World node.
      parameters:
        - $ref: '#/components/parameters/MapSlug'
        - $ref: '#/components/parameters/NodeSlug'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerNodeToolRequest'
      responses:
        '200':
          description: The source-defined result of the equipped-tool attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerNodeToolResult'
        '401': { description: Authentication is required. }
        '403': { description: A valid same-origin CSRF request is required. }
        '404': { description: The map node is unknown, inaccessible, or the tool is not owned by this learner. }
        '503': { description: The application database is unavailable. }
  /learner/bookmarks:
    get:
      operationId: getLearnerBookmarkMap
      summary: Read the signed-in learner's source-defined personal bookmark map.
      responses:
        '200':
          description: Visible bookmarks with their original map context and presentation assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerBookmarkMap'
        '401': { description: Authentication is required. }
        '403': { description: The current identity has no learner application principal. }
        '503': { description: The application database is unavailable. }
  /learner/competence:
    get:
      operationId: getLearnerCompetenceMap
      summary: Read the current learner's private qualitative evidence map.
      responses:
        '200':
          description: A bounded qualitative evidence and topic-transition view for the authenticated learner only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerCompetenceMap'
        '401': { description: Authentication is required. }
        '403': { description: The current identity has no learner application principal. }
        '503': { description: The application database is unavailable. }
  /learner/topics:
    get:
      operationId: getLearnerTopicDirectory
      summary: Read a bounded, authenticated directory of published topic areas.
      parameters:
        - name: area
          in: query
          schema: { type: string, pattern: '^[a-z0-9-]+$', maxLength: 80 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000 }
        - name: search
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Published root topics in the selected area, with visible-map counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerTopicDirectory'
        '400': { description: Directory query parameters are invalid. }
        '401': { description: Authentication is required. }
        '403': { description: The current identity has no learner application principal. }
        '503': { description: The application database is unavailable. }
  /learner/paths:
    get:
      operationId: getLearnerPaths
      summary: Read source-defined, currently eligible learner paths.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: purpose
          in: query
          schema: { type: string, enum: [apply, explain, participate, reflect, retrieve, review, transfer] }
        - name: time
          in: query
          schema: { type: integer, enum: [15, 30] }
        - name: topic
          in: query
          schema: { type: string, pattern: '^[a-z0-9-]+$', maxLength: 80 }
      responses:
        '200':
          description: Bounded paths from visible maps and currently playable nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerPaths'
        '401': { description: Authentication is required. }
        '403': { description: The current identity has no learner application principal. }
        '503': { description: The application database is unavailable. }
  /learner/search:
    get:
      operationId: searchLearnerDesk
      summary: Search published topics, visible maps and visible places for the Learning Desk.
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 24, default: 5 }
      responses:
        '200':
          description: Source-ordered, bounded Learning Desk results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerDeskSearch'
        '400': { description: The search query or pagination parameter is invalid. }
        '401': { description: Authentication is required. }
        '403': { description: The current identity has no learner application principal. }
        '503': { description: The application database is unavailable. }
  /learner/topics/{topic_slug}/overview:
    get:
      operationId: getLearnerTopicOverview
      summary: Read the authenticated learner's published topic overview and bounded subtopics.
      parameters:
        - $ref: '#/components/parameters/TopicSlug'
        - name: subtopics_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        '200':
          description: A published topic's source-defined overview section.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerTopicOverview'
        '400': { description: The topic or pagination parameter is invalid. }
        '401': { description: Authentication is required. }
        '403': { description: The current identity has no learner application principal. }
        '404': { description: The requested topic is unpublished or does not exist. }
        '503': { description: The application database is unavailable. }
  /learner/topics/{topic_slug}/trail:
    get:
      operationId: getLearnerTopicTrail
      summary: Read the authenticated learner's bounded private trail for a published topic.
      parameters:
        - $ref: '#/components/parameters/TopicSlug'
      responses:
        '200':
          description: A source-defined topic Trail scoped to the current learner and currently visible maps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerTopicTrail'
        '400': { description: The topic parameter is invalid. }
        '401': { description: Authentication is required. }
        '403': { description: The current identity has no learner application principal. }
        '404': { description: The requested topic is unpublished or does not exist. }
        '503': { description: The application database is unavailable. }
  /learner/topics/{topic_slug}/maps:
    get:
      operationId: getLearnerTopicMaps
      summary: Read the authenticated learner's visible maps for a published topic.
      parameters:
        - $ref: '#/components/parameters/TopicSlug'
        - name: maps_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        '200':
          description: A published topic's source-defined Maps section, scoped to visible maps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerTopicMaps'
        '400': { description: The topic or pagination parameter is invalid. }
        '401': { description: Authentication is required. }
        '403': { description: The current identity has no learner application principal. }
        '404': { description: The requested topic is unpublished or does not exist. }
        '503': { description: The application database is unavailable. }
  /learner/journal:
    get:
      operationId: getLearnerJournal
      summary: Read a bounded page of the authenticated learner's private journal.
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 24, default: 4 }
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 160 }
      responses:
        '200':
          description: Only the current learner's private journal pages, ordered by recent update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerJournalDocument'
        '400':
          description: Pagination or search parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Authentication is required.
