              schema: { $ref: '#/components/schemas/AdminEditableNode' }
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The identity has no application principal or role assignment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: The node is unknown or unavailable through the source activity-editor scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
  /admin/world-builder/nodes/{node_id}/activity-graph-layout:
    patch:
      operationId: updateAdminWorldBuilderNodeActivityGraphLayout
      summary: Save a selected node activity graph's start or end position.
      description: This source-derived authoring command requires World Activities update authority, its scoped editable map, and a same-origin CSRF token. It changes editor layout only; learner starts and activity playback remain unchanged.
      parameters:
        - name: node_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminActivityGraphLayoutRequest' }
      responses:
        '200':
          description: The complete persisted special-node layout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminActivityGraphLayoutResponse' }
        '400':
          description: The special graph node or its position is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The same-origin CSRF check failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: The node is unknown or outside the caller's authoring scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
  /admin/world-builder/activities/{activity_id}/graph-position:
    patch:
      operationId: updateAdminWorldBuilderActivityGraphPosition
      summary: Save an ordinary activity card's World Builder graph position.
      description: >-
        This source-derived drag command rounds finite coordinates to integers
        and changes authoring presentation only; it does not alter activity
        content, starts, transitions, or learner playback.
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminActivityGraphPositionRequest' }
      responses:
        '200':
          description: The persisted source-rounded activity-card position.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminActivityGraphPositionResponse' }
        '400': { description: The graph position is not finite or is outside the supported integer range. }
        '401': { description: The browser has no authenticated session. }
        '403': { description: The same-origin CSRF check failed. }
        '404': { description: The activity is unknown or outside the caller's authoring scope. }
        '503': { description: The application database is unavailable. }
  /admin/world-builder/activities/{activity_id}/versions:
    get:
      operationId: getAdminWorldBuilderActivityVersions
