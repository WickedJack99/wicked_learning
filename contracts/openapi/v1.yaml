      type: object
      additionalProperties: false
      required: [authenticator, created_at, id, last_used_at, name]
      properties:
        authenticator:
          type: [string, 'null']
          description: Optional authenticator label when safely known. This initial WebAuthn adapter deliberately does not infer an unverified device brand.
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        last_used_at:
          type: [string, 'null']
          format: date-time
        name:
          type: string
          minLength: 1
          maxLength: 255
