openapi: 3.1.1
info:
  title: Wicked Learning API
  version: 1.0.0-draft
  description: |
    The versioned contract between the React client and Rust/Axum API.
    The initial read-only public-information pages are available to prove the full React,
    contract, Axum and PostgreSQL path. User-facing writes and AI operations
    require a separately reviewed vertical slice.
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Report whether the API process is running.
      responses:
        '200':
          description: The API process is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report whether required databases are reachable.
      responses:
        '200':
          description: The API and both databases are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /session:
    get:
      operationId: getSessionStatus
      summary: Read the safe authentication state for the current browser session.
      responses:
        '200':
          description: Current session state without credential material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
  /me:
    get:
      operationId: getCurrentUser
      summary: Read the current authenticated subject and application roles.
      responses:
        '200':
          description: The opaque identity subject and roles currently granted by the application database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: The browser has no authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The identity has no application principal or role assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /session/login:
    post:
      operationId: createSession
      summary: Start a verified Rust-owned password session.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The authenticated session state. The server sets an HTTP-only session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '401':
          description: The email/password pair is invalid, inactive or unverified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many login attempts came from this client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The identity store is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /session/logout:
    post:
      operationId: deleteSession
      summary: End the current browser session.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '204':
          description: The session has been ended if one existed.
        '403':
          description: The request has a missing/invalid CSRF token or untrusted Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The identity store is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /security/csrf:
    get:
      operationId: getCsrfToken
      summary: Issue a token for a subsequent same-origin unsafe browser request.
      responses:
        '200':
          description: A short-lived CSRF token. The matching protected cookie is set by the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '500':
          description: The token could not be issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/pages/{slug}:
    get:
      operationId: getPublicPage
      summary: Read a published public-information page.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
            maxLength: 80
      responses:
        '200':
          description: A published public-information page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPage'
        '404':
          description: No published page has this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/source-links:
    get:
      operationId: getPublicSourceLinks
      summary: Read the public source-code links for this fresh deployment.
      responses:
        '200':
          description: The original project link and any deployment-specific modified-source links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSourceLinks'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/world:
    get:
      operationId: getPublicWorld
      summary: Read the first published fresh learning world for anonymous exploration.
      responses:
        '200':
          description: A bounded world, its published maps and their published map assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWorld'
        '404':
          description: No public world has been published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/worlds/{world_slug}/maps/{map_slug}/assets/{asset_slug}:
    get:
      operationId: getPublicMapAsset
      summary: Read a published focusable map place and its bounded route previews.
      parameters:
        - $ref: '#/components/parameters/PublicSlugPathWorld'
        - $ref: '#/components/parameters/PublicSlugPathMap'
        - $ref: '#/components/parameters/PublicSlugPathAsset'
      responses:
        '200':
          description: A published focusable map asset with at most 12 published route previews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMapAssetDetail'
        '404':
          description: No matching published focusable map asset exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/worlds/{world_slug}/maps/{map_slug}/assets/{asset_slug}/routes/{route_slug}:
    get:
      operationId: getPublicRouteOutline
      summary: Read a published route and its bounded published activity outline.
      parameters:
        - $ref: '#/components/parameters/PublicSlugPathWorld'
        - $ref: '#/components/parameters/PublicSlugPathMap'
        - $ref: '#/components/parameters/PublicSlugPathAsset'
        - $ref: '#/components/parameters/PublicSlugPathRoute'
      responses:
        '200':
          description: A published route with at most 24 published activity outlines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRouteOutline'
        '404':
          description: No matching published route exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/search:
    get:
      operationId: searchPublicWorld
      summary: Search published public map assets with a bounded literal query.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        '200':
          description: At most 20 published map-asset matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSearch'
        '400':
          description: The query is absent, too short or too long.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The application database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token from `GET /security/csrf`; the request must also have the matching protected cookie and an allowed Origin.
      schema:
        type: string
    PublicSlugPathWorld:
      name: world_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PublicSlugPathMap:
      name: map_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PublicSlugPathAsset:
      name: asset_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
    PublicSlugPathRoute:
      name: route_slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      type: object
      additionalProperties: false
      required: [code, title]
      properties:
        code:
          type: string
          example: dependency_unavailable
        title:
          type: string
          example: A required service is unavailable.
    SessionStatus:
      type: object
      additionalProperties: false
      required: [authenticated, subject_id]
      properties:
        authenticated:
          type: boolean
        subject_id:
          type: [string, 'null']
          format: uuid
          description: Opaque Rust identity subject identifier, available only for an authenticated session.
    CurrentUser:
      type: object
      additionalProperties: false
      required: [subject_id, roles]
      properties:
        subject_id:
          type: string
          format: uuid
          description: Opaque Rust-owned identity subject identifier.
        roles:
          type: array
          description: Application roles, not credentials or profile data.
          items:
            type: string
            enum: [platform_administrator]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: Send this value in the CSRF header defined by a future unsafe endpoint. It is not an authentication credential.
    PublicPage:
      type: object
      additionalProperties: false
      required: [slug, title, body]
      properties:
        slug:
          type: string
          example: about
        title:
          type: string
          example: About Wicked Learning
        body:
          type: string
          description: Plain text with paragraph breaks; the client must render it as text, not HTML.
    PublicSourceLink:
      type: object
      additionalProperties: false
      required: [label, url]
      properties:
        label:
          type: string
          maxLength: 80
        url:
          type: string
          format: uri
          description: An HTTP(S) link opened outside the application.
    PublicSourceLinks:
      type: object
      additionalProperties: false
      required: [origin, modified_sources]
      properties:
        origin:
          $ref: '#/components/schemas/PublicSourceLink'
        modified_sources:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/PublicSourceLink'
    PublicMapAsset:
      type: object
      additionalProperties: false
      required: [slug, title, description, x, y, z, image_url, text, width, opacity, locked, visual_config, interaction_config, sound_config, interaction_mode]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        title:
          type: string
        description:
          type: string
        x:
          type: number
          minimum: 0
          maximum: 100
        y:
          type: number
          minimum: 0
          maximum: 100
        z:
          type: integer
        image_url:
          type: [string, 'null']
          format: uri
        text:
          type: [string, 'null']
        width:
          type: number
          exclusiveMinimum: 0
        opacity:
          type: number
          minimum: 0
          maximum: 1
        locked:
          type: boolean
        visual_config:
          type: object
          additionalProperties: true
        interaction_config:
          type: object
          additionalProperties: true
        sound_config:
          type: object
          additionalProperties: true
        interaction_mode:
          type: string
          enum: [focusable, decorative, hide_on_hover, toggle]
    PublicNode:
      type: object
      additionalProperties: false
      required: [asset_slug, slug, title, description, q, r, state, visual_config]
      properties:
        asset_slug:
          type: [string, 'null']
          pattern: '^[a-z0-9-]+$'
          description: The published map-asset slug that presents this node, when it has one.
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        title:
          type: string
        description:
          type: string
        q:
          type: integer
        r:
          type: integer
        state:
          type: string
          enum: [available, locked, hidden]
        visual_config:
          type: object
          additionalProperties: true
    PublicMap:
      type: object
      additionalProperties: false
      required: [slug, title, description, background_config, grid_config, map_assets_locked, assets, nodes]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        title:
          type: string
        description:
          type: string
        background_config:
          type: object
          additionalProperties: true
        grid_config:
          type: object
          additionalProperties: true
        map_assets_locked:
          type: boolean
        assets:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PublicMapAsset'
        nodes:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PublicNode'
    PublicWorld:
      type: object
      additionalProperties: false
      required: [slug, title, description, theme_config, maps]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        title:
          type: string
        description:
          type: string
        theme_config:
          type: object
          additionalProperties: true
        maps:
          type: array
          maxItems: 24
          items:
            $ref: '#/components/schemas/PublicMap'
    PublicRoutePreview:
      type: object
      additionalProperties: false
      required: [slug, title, description, activity_count]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        title:
          type: string
        description:
          type: string
        activity_count:
          type: integer
          minimum: 0
    PublicMapAssetDetail:
      type: object
      additionalProperties: false
      required: [world_slug, world_title, map_slug, map_title, slug, title, description, routes]
      properties:
        world_slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        world_title:
          type: string
        map_slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        map_title:
          type: string
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        title:
          type: string
        description:
          type: string
        routes:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/PublicRoutePreview'
    PublicActivityOutline:
      type: object
      additionalProperties: false
      required: [slug, title, description]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        title:
          type: string
        description:
          type: string
    PublicRouteOutline:
      type: object
      additionalProperties: false
      required: [world_slug, world_title, map_slug, map_title, asset_slug, asset_title, slug, title, description, activities]
      properties:
        world_slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        world_title:
          type: string
        map_slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        map_title:
          type: string
        asset_slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        asset_title:
          type: string
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        title:
          type: string
        description:
          type: string
        activities:
          type: array
          maxItems: 24
          items:
            $ref: '#/components/schemas/PublicActivityOutline'
    PublicSearchResult:
      type: object
      additionalProperties: false
      required: [world_slug, map_slug, map_title, asset_slug, title, description]
      properties:
        world_slug:
          type: string
        map_slug:
          type: string
        map_title:
          type: string
        asset_slug:
          type: string
        title:
          type: string
        description:
          type: string
    PublicSearch:
      type: object
      additionalProperties: false
      required: [query, results]
      properties:
        query:
          type: string
        results:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PublicSearchResult'
