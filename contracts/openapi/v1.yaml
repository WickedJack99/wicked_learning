        - name: activity_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 24, default: 6 }
      responses:
        '200':
          description: A source-shaped bounded page of immutable activity snapshots.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminActivityVersionPage' }
        '400': { description: The requested history page is invalid. }
        '401': { description: The browser has no authenticated session. }
        '403': { description: The identity has no application principal or role assignment. }
        '404': { description: The activity is unknown or outside the caller's authoring scope. }
        '503': { description: The application database is unavailable. }
  /admin/world-builder/activities/{activity_id}/versions/{version_id}:
    get:
      operationId: getAdminWorldBuilderActivityVersion
      summary: Inspect one immutable Activity History snapshot.
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The selected immutable activity snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminActivityVersionDetailsResponse' }
        '401': { description: The browser has no authenticated session. }
        '403': { description: The identity has no application principal or role assignment. }
        '404': { description: The activity version is unknown or outside the caller's authoring scope. }
        '503': { description: The application database is unavailable. }
    post:
      operationId: restoreAdminWorldBuilderActivityVersion
      summary: Restore one immutable Activity History snapshot.
      description: Atomically preserves the current activity as a new snapshot, restores the selected activity and its outgoing transitions, and resets its review state.
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '204': { description: The selected snapshot was restored and the current state was retained in history. }
        '401': { description: The browser has no authenticated session. }
        '403': { description: The same-origin CSRF check failed. }
        '404': { description: The activity version is unknown or outside the caller's authoring scope. }
        '503': { description: The application database is unavailable. }
  /admin/activity-templates:
    get:
      operationId: getAdminActivityTemplates
      summary: List private and organization-shared reusable activity templates.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 24, default: 8 } }
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        '200': { description: A bounded template page visible to this author, content: { application/json: { schema: { $ref: '#/components/schemas/AdminActivityTemplatePage' } } } }
        '400': { description: The page or search is invalid. }
        '401': { description: The browser has no authenticated session. }
        '404': { description: The identity cannot author activities. }
        '503': { description: The application database is unavailable. }
  /admin/media-assets:
    get:
      operationId: getAdminMediaAssets
      summary: List bounded reusable visual assets available to an authorized administrator.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 12, default: 12 } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: tag, in: query, schema: { type: string, maxLength: 40 } }
      responses:
        '200': { description: A bounded reusable visual page., content: { application/json: { schema: { $ref: '#/components/schemas/AdminMediaAssetPage' } } } }
        '400': { description: The page or filters are invalid. }
        '401': { description: The browser has no authenticated session. }
        '404': { description: The identity cannot view reusable visual assets. }
        '503': { description: The application database is unavailable. }
    post:
      operationId: uploadAdminMediaAsset
      summary: Upload one fresh reusable visual after byte-level type validation.
      parameters: [ { $ref: '#/components/parameters/CsrfTokenHeader' } ]
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } }
      responses:
        '201': { description: The stored visual asset., content: { application/json: { schema: { $ref: '#/components/schemas/AdminMediaAssetResponse' } } } }
        '401': { description: The browser has no authenticated session. }
        '403': { description: The same-origin CSRF check failed. }
        '404': { description: The identity cannot manage reusable visual assets. }
        '413': { description: The upload exceeds five MiB. }
        '422': { description: The uploaded bytes are not an accepted image format. }
        '503': { description: Media storage or the application database is unavailable. }
  /admin/media-assets/{asset_id}:
    patch:
      operationId: updateAdminMediaAssetMetadata
      summary: Save bounded searchable metadata for one reusable visual asset.
      parameters: [ { name: asset_id, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/CsrfTokenHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminMediaAssetMetadataRequest' } } } }
      responses:
        '200': { description: The saved visual asset., content: { application/json: { schema: { $ref: '#/components/schemas/AdminMediaAssetResponse' } } } }
        '400': { description: The metadata is invalid. }
        '401': { description: The browser has no authenticated session. }
        '403': { description: The same-origin CSRF check failed. }
        '404': { description: The asset is unavailable or read-only. }
        '503': { description: The application database is unavailable. }
    delete:
      operationId: deleteAdminMediaAsset
      summary: Delete an unreferenced reusable visual asset.
      parameters: [ { name: asset_id, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/CsrfTokenHeader' } ]
      responses:
        '204': { description: The visual was removed. }
        '401': { description: The browser has no authenticated session. }
        '403': { description: The same-origin CSRF check failed. }
        '404': { description: The asset is unavailable, referenced, or cannot be deleted by this identity. }
        '503': { description: The application database is unavailable. }
  /admin/media-assets/{asset_id}/replace:
    post:
      operationId: replaceAdminMediaAsset
      summary: Replace an asset's bytes while preserving its stable reusable reference.
      parameters: [ { name: asset_id, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/CsrfTokenHeader' } ]
      requestBody:
        required: true
